name: Catalog v4 input recovery and builder repair
on:
  push:
    branches: [astra/catalog-clean-v4-20261006]
    paths: ['scripts/catalog-v4-preflight.py', '.github/workflows/catalog-v4-preflight.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-v4-preflight
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install packaging numpy Pillow
      - name: Repair complete builder and recover prior audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/catalog-v4-preflight.py
          python -m compileall -q tools
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --exit-code -- app worker public
      - name: Preserve repaired code and audit inputs on the isolated dataset branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_clean_core_v3.py data/catalog-v4/preflight
          if ! git diff --cached --quiet; then
            git commit -m 'fix(catalog): verify builder syntax and recover quality evidence'
            git push origin HEAD:astra/catalog-clean-v4-20261006
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-v4-preflight-${{ github.run_id }}
          path: data/catalog-v4/preflight
          retention-days: 30
