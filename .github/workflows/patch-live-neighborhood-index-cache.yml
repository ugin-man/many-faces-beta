name: Patch live neighborhood index cache

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/patch-live-neighborhood-index-cache.json

permissions:
  contents: write

concurrency:
  group: many-faces-patch-live-neighborhood-index-cache
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coverage-driven-200k
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/public/seed-catalog/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Reuse recent pose-neighborhood indexes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/live-responsive-lab.tsx')
          text = path.read_text(encoding='utf-8')
          import_block = '''import {
            LiveNeighborhoodIndexCache,
            liveNeighborhoodKey,
          } from "./live-neighborhood-index-cache.ts";
          '''
          if 'LiveNeighborhoodIndexCache' not in text:
              anchor = 'import { AdaptiveSearchCadence } from "./live-search-cadence.ts";\n'
              if anchor not in text:
                  raise SystemExit('Adaptive search import anchor was not found')
              text = text.replace(anchor, anchor + import_block, 1)

          if 'candidateIndexCacheRef' not in text:
              anchor = '  const candidatePoolRef = useRef<LiveCandidate[]>([]);\n'
              if anchor not in text:
                  raise SystemExit('Candidate pool ref anchor was not found')
              addition = '''  const candidateIndexCacheRef = useRef(
            new LiveNeighborhoodIndexCache<
              LiveCandidate,
              ReturnType<typeof buildLiveCandidateIndex>
            >({ maxEntries: 4 }),
          );
          '''
              text = text.replace(anchor, anchor + addition, 1)

          if 'const cachedNeighborhood = candidateIndexCacheRef.current.get(cacheKey);' not in text:
              anchor = '''    shardOrderRef.current = retained;
            const candidates = [...new Map(
          '''
              if anchor not in text:
                  raise SystemExit('Candidate index rebuild anchor was not found')
              replacement = '''    shardOrderRef.current = retained;
            const cacheKey = liveNeighborhoodKey(retained);
            const cachedNeighborhood = candidateIndexCacheRef.current.get(cacheKey);
            if (cachedNeighborhood) {
              candidatePoolRef.current = cachedNeighborhood.candidates;
              candidateIndexRef.current = cachedNeighborhood.index;
              setStats((value) => ({
                ...value,
                candidatePool: cachedNeighborhood.candidates.length,
                loadedShards: retained.length,
              }));
              return;
            }
            const candidates = [...new Map(
          '''
              text = text.replace(anchor, replacement, 1)

          if 'candidateIndexCacheRef.current.set(cacheKey' not in text:
              anchor = '''    candidateIndexRef.current = limited.length
              ? buildLiveCandidateIndex(limited)
              : null;
            setStats((value) => ({
          '''
              if anchor not in text:
                  raise SystemExit('Candidate index assignment anchor was not found')
              replacement = '''    candidateIndexRef.current = limited.length
              ? buildLiveCandidateIndex(limited)
              : null;
            candidateIndexCacheRef.current.set(cacheKey, {
              candidates: limited,
              index: candidateIndexRef.current,
            });
            setStats((value) => ({
          '''
              text = text.replace(anchor, replacement, 1)

          if 'candidateIndexCacheRef.current.clear();' not in text:
              anchor = '''      manifestRef.current = payload;
              setManifest(payload);
          '''
              if anchor not in text:
                  raise SystemExit('Manifest assignment anchor was not found')
              text = text.replace(
                  anchor,
                  '''      candidateIndexCacheRef.current.clear();
              manifestRef.current = payload;
              setManifest(payload);
          ''',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Extend realtime CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          workflow = Path('.github/workflows/live-realtime-ci.yml')
          text = workflow.read_text(encoding='utf-8')
          additions = (
              ('      - app/live-neighborhood-index-cache.ts\n', '      - app/live-search-cadence.ts\n'),
              ('      - tests/live-neighborhood-index-cache.test.mjs\n', '      - tests/live-search-cadence.test.mjs\n'),
          )
          for line, anchor in additions:
              if line not in text:
                  if anchor not in text:
                      raise SystemExit(f'Realtime CI path anchor missing: {anchor.strip()}')
                  text = text.replace(anchor, anchor + line, 1)
          command = '            tests/live-neighborhood-index-cache.test.mjs \\\n'
          if command not in text:
              anchor = '            tests/live-search-cadence.test.mjs \\\n'
              if anchor not in text:
                  raise SystemExit('Realtime CI neighborhood test anchor was not found')
              text = text.replace(anchor, anchor + command, 1)
          workflow.write_text(text, encoding='utf-8')

          config = Path('data/live-realtime-ci.json')
          payload = json.loads(config.read_text(encoding='utf-8'))
          payload['nonce'] = int(payload.get('nonce', 0)) + 1
          payload['neighborhoodIndexCache'] = 'four-entry-lru-v1'
          config.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate neighborhood index cache
        run: |
          npm ci
          npm run build
          node --experimental-strip-types --test \
            tests/live-matching.test.mjs \
            tests/live-responsive-runtime.test.mjs \
            tests/live-search-cadence.test.mjs \
            tests/live-neighborhood-index-cache.test.mjs \
            tests/live-packed-image-buffer.test.mjs \
            tests/live-responsive-image-buffer.test.mjs \
            tests/catalog-worker.test.mjs
          npm run lint
      - name: Commit neighborhood index cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/live-responsive-lab.tsx \
            .github/workflows/live-realtime-ci.yml \
            data/live-realtime-ci.json
          git commit -m "perf(live): reuse recent pose-neighborhood indexes"
          git fetch origin work/coverage-driven-200k
          git rebase origin/work/coverage-driven-200k
          git push origin HEAD:work/coverage-driven-200k
