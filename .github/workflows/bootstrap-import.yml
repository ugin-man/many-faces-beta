name: Bootstrap Many Faces Beta

on:
  push:
    paths:
      - bootstrap/start.json

permissions:
  contents: write

concurrency:
  group: many-faces-bootstrap
  cancel-in-progress: false

jobs:
  import:
    if: github.repository_owner == 'ugin-man'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Restore application source
        run: base64 --decode bootstrap/source.tar.gz.b64 | tar -xz
      - name: Download the verified 70k catalog
        run: >-
          node tools/export_catalog_from_site.mjs
          --site https://many-faces-prototype.uginn-poppo.chatgpt.site
          --output public/seed-catalog
          --concurrency 16
      - name: Restore the reusable verification video
        run: |
          mkdir -p public/test-fixtures
          curl --fail --location --retry 4 --output public/test-fixtures/reference-face-motion.mp4 https://many-faces-prototype.uginn-poppo.chatgpt.site/test-fixtures/reference-face-motion.mp4
          curl --fail --location --retry 4 --output public/test-fixtures/reference-face-motion-analysis.json https://many-faces-prototype.uginn-poppo.chatgpt.site/test-fixtures/reference-face-motion-analysis.json
          curl --fail --location --retry 4 --output public/test-fixtures/reference-face-motion-rankings.json https://many-faces-prototype.uginn-poppo.chatgpt.site/test-fixtures/reference-face-motion-rankings.json
      - name: Validate all catalog objects
        run: |
          node tools/validate_face_catalog.mjs public/seed-catalog
          find public/seed-catalog -type f -print0 | sort -z | xargs -0 sha256sum > data/SHA256SUMS
          sha256sum -c data/SHA256SUMS
      - name: Verify the application
        run: |
          npm ci
          npm test
      - name: Commit the complete repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r -- bootstrap
          git add -- .gitignore .npmrc .openai CATALOG.md DATA_LICENSE.md LICENSE README.md app data db drizzle drizzle.config.ts eslint.config.mjs examples next.config.ts package-lock.json package.json postcss.config.mjs public scripts tests tools tsconfig.json vite.config.ts worker
          git commit -m "Publish Many Faces Beta with verified 70k catalog"
          git push
