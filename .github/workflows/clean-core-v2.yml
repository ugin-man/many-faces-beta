name: Build clean core v2 70k

on:
  pull_request:
    branches: [main]
    paths:
      - data/clean-core-v2-spec.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: many-faces-clean-core-v2
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.spec.outputs.windows }}
      targeted: ${{ steps.spec.outputs.targeted }}
      target_total: ${{ steps.spec.outputs.target_total }}
      max_per_image: ${{ steps.spec.outputs.max_per_image }}
      min_box_area: ${{ steps.spec.outputs.min_box_area }}
      allow_occluded: ${{ steps.spec.outputs.allow_occluded }}
      allow_truncated: ${{ steps.spec.outputs.allow_truncated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: /data/clean-core-v2-spec.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - id: spec
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          spec=json.loads(Path('data/clean-core-v2-spec.json').read_text())
          windows=spec.get('windows',[]); targeted=spec.get('targeted',[])
          if not windows: raise SystemExit('no Open Images windows')
          seen=set()
          for item in windows:
              if item['id'] in seen: raise SystemExit(f"duplicate window {item['id']}")
              seen.add(item['id'])
              if item['candidateLimit'] < item['offset'] + item['maxImages']:
                  raise SystemExit(f"candidateLimit does not cover {item['id']}")
          oi=spec.get('openImages',{})
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('windows='+json.dumps({'include':windows},separators=(',',':'))+'\n')
              out.write('targeted='+json.dumps({'include':targeted},separators=(',',':'))+'\n')
              out.write(f"target_total={int(spec.get('targetTotal',70000))}\n")
              out.write(f"max_per_image={int(oi.get('maxPerImage',4))}\n")
              out.write(f"min_box_area={float(oi.get('minBoxArea',0.004))}\n")
              out.write(f"allow_occluded={'true' if oi.get('allowOccluded',True) else 'false'}\n")
              out.write(f"allow_truncated={'true' if oi.get('allowTruncated',True) else 'false'}\n")
          PY

  collect-open-images:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.windows) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /tools/*
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt
      - uses: actions/cache@v4
        with:
          path: .cache/open-images/${{ matrix.split }}
          key: open-images-${{ matrix.split }}-v1
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt
      - name: Stage source window
        shell: bash
        run: |
          FLAGS=()
          [[ "${{ needs.prepare.outputs.allow_occluded }}" == "true" ]] && FLAGS+=(--allow-occluded)
          [[ "${{ needs.prepare.outputs.allow_truncated }}" == "true" ]] && FLAGS+=(--allow-truncated)
          python tools/open_images_face_source_windowed.py work/stage \
            --split "${{ matrix.split }}" --cache .cache/open-images \
            --candidate-offset "${{ matrix.offset }}" --max-images "${{ matrix.maxImages }}" \
            --candidate-limit "${{ matrix.candidateLimit }}" \
            --max-per-image "${{ needs.prepare.outputs.max_per_image }}" \
            --min-box-area "${{ needs.prepare.outputs.min_box_area }}" \
            --workers 24 "${FLAGS[@]}"
      - name: Curate isolated v2 states
        run: |
          python tools/curate-clean-core-v2.py work/stage work/accepted \
            --min-face-area 0.075 --max-files "${{ matrix.maxImages }}"
      - name: Build source catalog
        run: |
          python tools/build_face_catalog_compat.py work/accepted work/supplement \
            --metadata work/accepted/metadata.csv --yaw-min -45 --yaw-max 45 \
            --pitch-min -36 --pitch-max 36 --overwrite
          node tools/finalize-supplement-catalog.mjs --catalog work/supplement \
            --catalog-id "clean-v2-source-${{ matrix.id }}-${GITHUB_RUN_ID}"
          node tools/validate_face_catalog.mjs work/supplement | tee work/supplement-validation.json
      - name: Upload source catalog
        uses: actions/upload-artifact@v4
        with:
          name: clean-v2-source-${{ matrix.id }}
          path: |
            work/stage/source-report.json
            work/accepted/clean-curation-report.json
            work/supplement
            work/supplement-validation.json
          retention-days: 7
          compression-level: 6

  collect-targeted:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.targeted) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: /tools/*
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt
      - name: Stage targeted licensed portraits
        run: |
          node tools/stage_clean_core_targets.mjs --output work/stage \
            --provider "${{ matrix.provider }}" --max-images "${{ matrix.maxImages }}" \
            --pages "${{ matrix.pages }}" --per-page "${{ matrix.perPage }}"
      - name: Curate and mirror asymmetric single factors
        run: |
          python tools/curate-clean-core-v2.py work/stage work/accepted --min-face-area 0.07
          python tools/mirror_clean_core_pairs.py work/accepted work/expanded --overwrite
      - name: Build targeted source catalog
        run: |
          python tools/build_face_catalog_compat.py work/expanded work/supplement \
            --metadata work/expanded/metadata.csv --yaw-min -45 --yaw-max 45 \
            --pitch-min -36 --pitch-max 36 --overwrite
          node tools/finalize-supplement-catalog.mjs --catalog work/supplement \
            --catalog-id "clean-v2-targeted-${{ matrix.id }}-${GITHUB_RUN_ID}"
          node tools/validate_face_catalog.mjs work/supplement | tee work/supplement-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: clean-v2-targeted-${{ matrix.id }}
          path: |
            work/stage/source-report.json
            work/accepted/clean-curation-report.json
            work/supplement
            work/supplement-validation.json
          retention-days: 7
          compression-level: 6

  assemble:
    needs: [prepare, collect-open-images, collect-targeted]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install assembly runtime
        run: |
          python -m pip install --disable-pip-version-check numpy Pillow
          python -m unittest tests/test_clean_core_policy_v2.py
      - uses: actions/download-artifact@v4
        with:
          pattern: clean-v2-*
          path: work/source-artifacts
      - id: build
        name: Build physical 70k clean core
        continue-on-error: true
        shell: bash
        run: |
          ARGS=(--catalog "seed-ffhq=public/seed-catalog")
          while IFS= read -r manifest; do
            root=$(dirname "$manifest"); label=$(basename "$(dirname "$root")")
            ARGS+=(--catalog "${label}=${root}")
          done < <(find work/source-artifacts -path '*/supplement/manifest.json' -type f | sort)
          python tools/build_clean_core_v2.py work/clean-core-v2 --overwrite \
            --target-total "${{ needs.prepare.outputs.target_total }}" "${ARGS[@]}"
      - name: Validate completed catalog
        if: hashFiles('work/clean-core-v2/catalog/manifest.json') != ''
        run: node tools/validate_face_catalog.mjs work/clean-core-v2/catalog | tee work/clean-core-v2/catalog-validation.json
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: many-faces-clean-core-v2-${{ github.run_id }}
          path: |
            work/clean-core-v2
            data/clean-core-v2-spec.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Enforce honest completion gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('work/clean-core-v2/audit.json')
          if not path.exists(): raise SystemExit('No v2 audit produced')
          audit=json.loads(path.read_text())
          print(json.dumps(audit,indent=2))
          if not audit.get('gatePassed'):
              raise SystemExit('Clean Core v2 is not complete:\n- '+'\n- '.join(audit.get('gateFailures',[])))
          if not Path('work/clean-core-v2/catalog/manifest.json').exists():
              raise SystemExit('Gate passed but physical manifest is missing')
          PY
