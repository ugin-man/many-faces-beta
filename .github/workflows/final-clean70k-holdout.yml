name: Final independent Clean70k visual holdout
on:
  push:
    branches: [astra/realtime-hardening]
    paths:
      - 'scripts/prepare-final-holdout.py'
      - '.github/workflows/final-clean70k-holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - name: Sample and prepare actual published 70k photo bytes
        run: python scripts/prepare-final-holdout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-clean70k-holdout-${{ github.run_id }}
          path: work/final-holdout/
          retention-days: 30
