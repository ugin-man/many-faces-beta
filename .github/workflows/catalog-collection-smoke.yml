name: Catalog collection smoke

on:
  pull_request:
    paths:
      - .github/workflows/catalog-collection-smoke.yml
      - data/coverage-checkpoints/**
      - tools/coverage-200k-plan.mjs
      - tools/apply_coverage_checkpoints.py
      - tools/open_images_face_source.py
      - tools/coverage_router.py
      - tools/curate-coverage-candidates.py
      - tools/build_face_catalog.py
      - tools/build_face_catalog_compat.py
      - tools/finalize-supplement-catalog.mjs
      - tools/validate_face_catalog.mjs
      - tools/requirements-catalog.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'work/coverage-driven-200k'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /tools/*
            /data/coverage-checkpoints/*
            /public/seed-catalog/manifest.json
            /public/seed-catalog/shards/*
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt

      - name: Cache Open Images validation metadata
        uses: actions/cache@v4
        with:
          path: .cache/open-images/validation
          key: open-images-validation-v1

      - name: Install catalog runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt

      - name: Measure base catalog and apply packed checkpoints
        run: |
          mkdir -p work
          node tools/coverage-200k-plan.mjs \
            --manifest public/seed-catalog/manifest.json \
            --target 200000 \
            --output work/base-coverage-plan.json
          python tools/apply_coverage_checkpoints.py \
            work/base-coverage-plan.json \
            work/coverage-plan.json \
            --checkpoints data/coverage-checkpoints

      - name: Stage attributed Open Images face crops
        run: |
          python tools/open_images_face_source.py work/stage \
            --split validation \
            --cache .cache/open-images \
            --max-images 1800 \
            --candidate-limit 2197 \
            --min-box-area 0.006 \
            --allow-occluded \
            --workers 12

      - name: Measure first, then route each face into a live gap
        id: curate
        continue-on-error: true
        run: |
          python tools/curate-coverage-candidates.py \
            work/stage \
            work/accepted \
            --coverage-plan work/coverage-plan.json \
            --route-any-gap \
            --route-yaw-tolerance 9 \
            --route-pitch-tolerance 9 \
            --max-files 1800

      - name: Require a meaningful measured sample
        if: steps.curate.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/accepted/curation-report.json").read_text())
          if report["accepted"] < 100:
              raise SystemExit(f"Only {report['accepted']} measured faces filled a live gap; need at least 100 for the expanded batch")
          PY

      - name: Build a packed supplement catalog
        if: steps.curate.outcome == 'success'
        run: |
          python tools/build_face_catalog_compat.py \
            work/accepted \
            work/supplement \
            --metadata work/accepted/metadata.csv \
            --yaw-min -45 \
            --yaw-max 45 \
            --pitch-min -36 \
            --pitch-max 36 \
            --overwrite
          node tools/finalize-supplement-catalog.mjs \
            --catalog work/supplement \
            --catalog-id "open-images-validation-${GITHUB_RUN_ID}"
          node tools/validate_face_catalog.mjs work/supplement | tee work/supplement-validation.json

      - name: Write collection summary
        if: always()
        run: |
          {
            echo "## Open Images cumulative coverage batch"
            echo
            echo "This run creates a reviewable supplement artifact only; it never mutates the 70k base catalog."
            echo
            if [[ -f work/coverage-plan.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("work/coverage-plan.json").read_text())
          print(f"- Base searchable faces: {p.get('baseFaces', p['currentFaces']):,}")
          print(f"- Packed checkpoint faces: {p.get('checkpointFaces', 0):,}")
          print(f"- Effective current faces: {p['currentFaces']:,}")
          print(f"- Target: {p['targetFaces']:,}")
          print(f"- Remaining planned additions: {p['neededImages']:,}")
          print(f"- Open queue items: {len(p['collectionQueue']):,}")
          PY
            fi
            if [[ -f work/stage/source-report.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("work/stage/source-report.json").read_text())
          print(f"- Human-face box rows: {p['boxStats']['humanFaceRows']}")
          print(f"- Licensed deterministic candidates: {p['licensedCandidates']}")
          print(f"- Face crops staged: {p.get('staged', 0)}")
          print(f"- Source download failures: {sum(p.get('downloadFailures', {}).values())}")
          PY
            fi
            if [[ -f work/accepted/curation-report.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("work/accepted/curation-report.json").read_text())
          print(f"- Measured: {p['checked']}")
          print(f"- Routed and accepted before packing: {p['accepted']}")
          print(f"- Rejected: {p['rejected']}")
          print(f"- Rejection reasons: {p['reasons']}")
          routing = p.get('coverageRouting', {})
          print(f"- Distinct routed gaps: {len(routing.get('assignedByGap', {}))}")
          PY
            fi
            if [[ -f work/supplement/manifest.json ]]; then
              node -e 'const p=require("./work/supplement/manifest.json"); console.log(`- Packed supplement faces: ${p.searchableFaces}`); console.log(`- Pose cells represented: ${Object.keys(p.cells||{}).length}`); console.log(`- Provenance complete: ${p.stats?.provenance?.licensedEntries === p.searchableFaces}`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewable collection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-images-coverage-batch-${{ github.run_id }}
          path: |
            work/base-coverage-plan.json
            work/coverage-plan.json
            work/stage/metadata.csv
            work/stage/source-report.json
            work/stage/images
            work/accepted/metadata.csv
            work/accepted/curation-report.json
            work/accepted/images
            work/supplement
            work/supplement-validation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require successful measured routing
        if: steps.curate.outcome != 'success'
        run: |
          echo "No staged Open Images face filled a measured catalog gap. Inspect the uploaded source and curation reports." >&2
          exit 1
