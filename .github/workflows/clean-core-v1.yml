name: Build clean core v1

on:
  pull_request:
    branches:
      - main
    paths:
      - data/clean-core-v1-spec.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: many-faces-clean-core-v1
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.spec.outputs.matrix }}
      max_total: ${{ steps.spec.outputs.max_total }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /data/clean-core-v1-spec.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - id: spec
        name: Validate build specification
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          spec = json.loads(Path("data/clean-core-v1-spec.json").read_text())
          windows = spec.get("windows", [])
          if not windows:
              raise SystemExit("clean-core spec contains no source windows")
          seen = set()
          for window in windows:
              required = ("id", "split", "offset", "maxImages", "candidateLimit")
              missing = [key for key in required if key not in window]
              if missing:
                  raise SystemExit(f"window missing fields {missing}: {window}")
              if window["id"] in seen:
                  raise SystemExit(f"duplicate window id: {window['id']}")
              seen.add(window["id"])
              if window["split"] not in {"train", "validation", "test"}:
                  raise SystemExit(f"unsupported split: {window['split']}")
              if int(window["offset"]) < 0 or int(window["maxImages"]) <= 0:
                  raise SystemExit(f"invalid window range: {window}")
              if int(window["candidateLimit"]) < int(window["offset"]) + int(window["maxImages"]):
                  raise SystemExit(f"candidateLimit does not cover window: {window}")
          matrix = json.dumps({"include": windows}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={matrix}\n")
              output.write(f"max_total={int(spec.get('maxTotal', 0))}\n")
          PY

  collect:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /tools/*
            /data/clean-core-v1-spec.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt

      - name: Cache Open Images metadata
        uses: actions/cache@v4
        with:
          path: .cache/open-images/${{ matrix.split }}
          key: open-images-${{ matrix.split }}-v1

      - name: Install catalog runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt

      - name: Stage deterministic source window
        run: |
          python tools/open_images_face_source_windowed.py work/stage \
            --split "${{ matrix.split }}" \
            --cache .cache/open-images \
            --candidate-offset "${{ matrix.offset }}" \
            --max-images "${{ matrix.maxImages }}" \
            --candidate-limit "${{ matrix.candidateLimit }}" \
            --min-box-area 0.008 \
            --workers 20

      - name: Keep isolated clean states only
        run: |
          python tools/curate-clean-core-candidates.py \
            work/stage \
            work/accepted \
            --min-face-area 0.10 \
            --max-files "${{ matrix.maxImages }}"

      - name: Build and validate source supplement
        run: |
          python tools/build_face_catalog_compat.py \
            work/accepted \
            work/supplement \
            --metadata work/accepted/metadata.csv \
            --yaw-min -45 \
            --yaw-max 45 \
            --pitch-min -36 \
            --pitch-max 36 \
            --overwrite
          node tools/finalize-supplement-catalog.mjs \
            --catalog work/supplement \
            --catalog-id "clean-source-${{ matrix.id }}-${GITHUB_RUN_ID}"
          node tools/validate_face_catalog.mjs work/supplement \
            | tee work/supplement-validation.json

      - name: Write source summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("## Clean source ${{ matrix.id }}")
          if Path("work/stage/source-report.json").exists():
              report = json.loads(Path("work/stage/source-report.json").read_text())
              print(f"- Staged: {report.get('staged', 0):,}")
              print(f"- Source window: {report.get('windowStart', 0):,}..{report.get('windowEnd', 0)-1:,}")
          if Path("work/accepted/clean-curation-report.json").exists():
              report = json.loads(Path("work/accepted/clean-curation-report.json").read_text())
              print(f"- Clean isolated states: {report.get('accepted', 0):,}")
              print(f"- Profiles: {report.get('profiles', {})}")
          if Path("work/supplement/manifest.json").exists():
              manifest = json.loads(Path("work/supplement/manifest.json").read_text())
              print(f"- Packed faces: {manifest.get('searchableFaces', 0):,}")
              print(f"- Pose cells: {len(manifest.get('cells', {})):,}")
          PY

      - name: Upload clean source catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-source-${{ matrix.id }}
          path: |
            work/stage/source-report.json
            work/accepted/metadata.csv
            work/accepted/clean-curation-report.json
            work/supplement
            work/supplement-validation.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  assemble:
    needs:
      - prepare
      - collect
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt

      - name: Install clean-core runtime
        run: |
          python -m pip install --disable-pip-version-check numpy Pillow
          python -m unittest tests/test_clean_core_policy.py

      - name: Download clean source catalogs
        uses: actions/download-artifact@v4
        with:
          pattern: clean-source-*
          path: work/source-artifacts

      - name: Build clean core from FFHQ and clean source catalogs
        run: |
          ARGS=(--catalog "seed-ffhq=public/seed-catalog")
          while IFS= read -r manifest; do
            root=$(dirname "$manifest")
            label=$(basename "$(dirname "$root")")
            ARGS+=(--catalog "${label}=${root}")
          done < <(find work/source-artifacts -path '*/supplement/manifest.json' -type f | sort)
          python tools/build_clean_core.py \
            work/clean-core-v1 \
            --overwrite \
            --max-total "${{ needs.prepare.outputs.max_total }}" \
            "${ARGS[@]}"
          node tools/validate_face_catalog.mjs work/clean-core-v1/catalog \
            | tee work/clean-core-v1/catalog-validation.json

      - name: Enforce review milestone
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("work/clean-core-v1/audit.json").read_text())
          profiles = audit["selectedProfiles"]
          mouth = sum(count for name, count in profiles.items() if name.startswith("mouth") or name.startswith("smile"))
          nonzero = sum(1 for count in profiles.values() if count > 0)
          failures = []
          if audit["selectedFaces"] < 12000:
              failures.append(f"selectedFaces={audit['selectedFaces']:,} < 12,000")
          if audit["selectedPoseCells"] < 650:
              failures.append(f"selectedPoseCells={audit['selectedPoseCells']:,} < 650")
          if mouth < 4000:
              failures.append(f"mouth-profile images={mouth:,} < 4,000")
          if profiles.get("neutral", 0) < 1500:
              failures.append(f"neutral images={profiles.get('neutral', 0):,} < 1,500")
          if nonzero < 10:
              failures.append(f"non-empty profiles={nonzero} < 10")
          if failures:
              raise SystemExit("Clean-core review gate failed:\n- " + "\n- ".join(failures))
          PY

      - name: Write final review summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          audit = json.loads(Path("work/clean-core-v1/audit.json").read_text())
          print("## Many Faces clean core v1")
          print()
          print(f"- Selected faces: {audit['selectedFaces']:,}")
          print(f"- Covered 3-degree pose cells: {audit['selectedPoseCells']:,}")
          print(f"- Input indexed candidates: {audit['inputEntries']:,}")
          print(f"- Profiles: {audit['selectedProfiles']}")
          print(f"- Sources: {audit['selectedSources']}")
          print()
          print("Open `review/index.html` after downloading the artifact.")
          PY

      - name: Upload reviewable clean core
        uses: actions/upload-artifact@v4
        with:
          name: many-faces-clean-core-v1-${{ github.run_id }}
          path: |
            work/clean-core-v1
            data/clean-core-v1-spec.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
