name: Patch responsive live lint

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/patch-live-responsive-lint.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coverage-driven-200k
          fetch-depth: 1
      - name: Apply React lint-safe initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/live-responsive-lab.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  if (!imageBufferRef.current) {\n',
              '  if (imageBufferRef.current == null) {\n',
              1,
          )
          old = '''  useEffect(() => {\n    void reloadCatalog();\n  }, [reloadCatalog]);\n'''
          new = '''  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      void reloadCatalog();\n    }, 0);\n    return () => window.clearTimeout(timer);\n  }, [reloadCatalog]);\n'''
          if old not in text:
              raise SystemExit('reloadCatalog effect marker was not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit lint patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/live-responsive-lab.tsx
          git commit -m "fix(live): make responsive initialization lint-safe"
          git push origin HEAD:work/coverage-driven-200k
