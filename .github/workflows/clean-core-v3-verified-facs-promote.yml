name: Promote verified-FACS Clean Core v3

on:
  pull_request:
    branches: [main]
    paths:
      - data/clean-core-v3-verified-facs-launch.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: many-faces-clean-core-v3-verified-facs
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "32559210408"
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        shell: bash
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          echo "HEAD subject: ${SUBJECT}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${SUBJECT}" == "chore(dataset): launch verified FACS promotion"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not an explicit verified-FACS launch; expensive jobs are skipped."
          fi

  collect-facs:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /tools/*
            /tests/test_verified_facs_overlay.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt
      - name: Install runtime and verify canonical profiles
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt kagglehub
          python -m unittest tests/test_verified_facs_overlay.py
      - name: Stage controlled single-AU source
        run: |
          python tools/run_stage_synthetic_facs_v3.py work/stage \
            --cache .cache/synthetic-humans-facs --max-images 0 --overwrite
      - name: Curate verified FACS without cross-expression dedupe
        run: |
          python tools/run_curate_clean_core_v3_facs.py \
            work/stage work/accepted --min-face-area 0.065
      - name: Mirror asymmetric states and build supplement
        run: |
          python tools/mirror_clean_core_pairs.py work/accepted work/expanded --overwrite
          python tools/build_face_catalog_compat.py \
            work/expanded work/supplement \
            --metadata work/expanded/metadata.csv \
            --yaw-min -45 --yaw-max 45 --pitch-min -36 --pitch-max 36 --overwrite
          node tools/finalize-supplement-catalog.mjs \
            --catalog work/supplement \
            --catalog-id "clean-v3-facs-verified-${GITHUB_RUN_ID}"
          python tools/apply_verified_facs_annotations.py \
            work/expanded work/supplement \
            --metadata work/expanded/metadata.csv
          node tools/validate_face_catalog.mjs work/supplement \
            | tee work/supplement-validation.json
      - name: Upload verified FACS source before gating
        uses: actions/upload-artifact@v4
        with:
          name: clean-v3-facs-verified
          path: |
            work/stage/source-report.json
            work/accepted/clean-curation-report.json
            work/supplement
            work/supplement-validation.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Require materially useful packed FACS coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/supplement/facs-annotation-overlay.json').read_text())
          profiles=report.get('profiles',{})
          print(json.dumps(report,indent=2))
          required={
            'winkLeft':80,'winkRight':80,'blink':120,'eyesWide':120,
            'browsUp':120,'browsDown':120,'noseSneer':100,
            'mouthRound':100,'mouthPucker':140,'mouthWide':120,
            'mouthPress':180,'mouthFrown':100,'mouthShrug':90,
            'mouthUpperUp':90,'mouthLowerDown':90,'mouthSlightOpen':120,
            'smileClosed':120,
          }
          failures=[
            f"{name}={int(profiles.get(name,0))} < {minimum}"
            for name,minimum in required.items()
            if int(profiles.get(name,0)) < minimum
          ]
          if failures:
            raise SystemExit('Verified FACS coverage is insufficient:\n- '+'\n- '.join(failures))
          PY

  assemble-promote:
    needs: [prepare, collect-facs]
    if: needs.prepare.outputs.run == 'true' && needs.collect-facs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install assembly runtime
        run: |
          python -m pip install --disable-pip-version-check numpy Pillow
          python -m unittest tests/test_clean_core_policy_v3.py tests/test_verified_facs_overlay.py
      - name: Download validated Open Images source catalogs
        uses: actions/download-artifact@v4
        with:
          pattern: clean-v3-source-*
          path: work/source-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download verified FACS source catalog
        uses: actions/download-artifact@v4
        with:
          name: clean-v3-facs-verified
          path: work/source-artifacts/clean-v3-facs-verified
      - name: Build the physical 70k catalog
        shell: bash
        run: |
          ARGS=(--catalog "seed-ffhq=public/seed-catalog")
          while IFS= read -r manifest; do
            root=$(dirname "$manifest")
            label=$(basename "$(dirname "$root")")
            ARGS+=(--catalog "${label}=${root}")
          done < <(find work/source-artifacts -path '*/supplement/manifest.json' -type f | sort)
          python tools/run_build_clean_core_v3_repair.py \
            work/clean-core-v3 --overwrite --target-total 70000 "${ARGS[@]}"
      - name: Validate physical catalog and honest gate
        run: |
          node tools/validate_face_catalog.mjs work/clean-core-v3/catalog \
            | tee work/clean-core-v3/catalog-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('work/clean-core-v3/audit.json').read_text())
          manifest=json.loads(Path('work/clean-core-v3/catalog/manifest.json').read_text())
          if not audit.get('gatePassed'):
            raise SystemExit('Clean Core gate failed:\n- '+'\n- '.join(audit.get('gateFailures',[])))
          faces=int(manifest.get('searchableFaces',manifest.get('totalFaces',0)))
          if int(audit.get('selectedFaces',0)) != 70000 or faces != 70000:
            raise SystemExit(f"Expected exactly 70,000 physical faces: audit={audit.get('selectedFaces')} manifest={faces}")
          if int(audit.get('selectedPoseCells',0)) < 700:
            raise SystemExit(f"Pose coverage too small: {audit.get('selectedPoseCells')}")
          for side in ('winkLeft','winkRight'):
            if int(audit.get('strictProfiles',{}).get(side,0)) < 80:
              raise SystemExit(f"{side} is still under 80")
          print(json.dumps({
            'faces':faces,
            'poseCells':audit.get('selectedPoseCells'),
            'strictProfiles':audit.get('strictProfiles',{}),
            'backgroundProfiles':audit.get('backgroundProfiles',{}),
            'sources':audit.get('selectedSources',{}),
          },indent=2))
          PY
      - name: Replace the legacy site seed
        run: |
          rm -rf public/seed-catalog
          mkdir -p public/seed-catalog
          cp -a work/clean-core-v3/catalog/. public/seed-catalog/
          cp work/clean-core-v3/audit.json public/seed-catalog/clean-core-audit.json
          cp work/clean-core-v3/catalog-validation.json public/seed-catalog/catalog-validation.json
      - name: Verify exactly what the Site build will load
        run: |
          node tools/validate_face_catalog.mjs public/seed-catalog \
            | tee /tmp/site-seed-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('public/seed-catalog/manifest.json').read_text())
          audit=json.loads(Path('public/seed-catalog/clean-core-audit.json').read_text())
          faces=int(manifest.get('searchableFaces',manifest.get('totalFaces',0)))
          if faces != 70000:
            raise SystemExit(f"Site seed is not 70,000 faces: {faces}")
          if manifest.get('poseStep') != 3:
            raise SystemExit(f"Unexpected pose step: {manifest.get('poseStep')}")
          if audit.get('policyVersion') != 'clean-single-factor-v3':
            raise SystemExit(f"Unexpected policy: {audit.get('policyVersion')}")
          PY
      - name: Write transparent Site build receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('public/seed-catalog/clean-core-audit.json').read_text())
          manifest=json.loads(Path('public/seed-catalog/manifest.json').read_text())
          receipt={
            'schemaVersion':1,
            'status':'promoted-to-site-seed',
            'sourceWorkflowRunId':int('${{ env.SOURCE_RUN_ID }}'),
            'promotionWorkflowRunId':int('${{ github.run_id }}'),
            'policyVersion':audit.get('policyVersion'),
            'catalogId':manifest.get('catalogId'),
            'searchableFaces':manifest.get('searchableFaces',manifest.get('totalFaces')),
            'poseStep':manifest.get('poseStep'),
            'poseCells':audit.get('selectedPoseCells'),
            'strictProfiles':audit.get('strictProfiles',{}),
            'backgroundProfiles':audit.get('backgroundProfiles',{}),
            'selectedSources':audit.get('selectedSources',{}),
            'rejections':audit.get('rejections',{}),
          }
          Path('data/clean-core-v3-site-build.json').write_text(
            json.dumps(receipt,ensure_ascii=False,indent=2)+'\n'
          )
          PY
      - name: Commit physical seed replacement to the work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 1073741824
          git add -A -- public/seed-catalog data/clean-core-v3-site-build.json
          git commit -m "feat(dataset): promote verified 70k clean core v3 site seed"
          git push origin HEAD:work/coverage-driven-200k
      - uses: actions/upload-artifact@v4
        with:
          name: many-faces-clean-core-v3-site-seed-${{ github.run_id }}
          path: |
            public/seed-catalog
            data/clean-core-v3-site-build.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
