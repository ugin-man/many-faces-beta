name: Astra realtime hardening

on:
  push:
    branches: [astra/realtime-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-realtime-hardening
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/realtime-hardening
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/public/seed-catalog/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false

      - name: Apply idempotent hardening
        run: python tools/astra_realtime_hardening.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Targeted realtime tests
        run: |
          node --experimental-strip-types --test \
            tests/astra-realtime-hardening.test.mjs \
            tests/live-responsive-runtime.test.mjs \
            tests/live-packed-image-buffer.test.mjs \
            tests/live-review-timeline.test.mjs \
            tests/live-review-local-catalog.test.mjs \
            tests/live-verification-gate.test.mjs \
            tests/catalog-worker.test.mjs

      - name: Lint
        run: npm run lint

      - name: Write receipt
        if: always()
        run: |
          mkdir -p artifacts
          cat > artifacts/astra-realtime-hardening.json <<JSON
          {
            "base": "0ddb7a72a794f410424793a290a221d456739478",
            "testedCommit": "${{ github.sha }}",
            "runId": ${{ github.run_id }},
            "route": "/live",
            "realtimeExperimentRoute": "/live/fast",
            "fixedVideoStatus": "verified-reference-path",
            "cameraStatus": "experimental",
            "hardening": "decoded-frame-timeout-fails-closed"
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-realtime-hardening-${{ github.run_id }}
          path: artifacts/astra-realtime-hardening.json

      - name: Commit hardening patch once
        run: |
          if git diff --quiet -- app/live/review-client-lite.tsx; then
            echo "hardening source already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/live/review-client-lite.tsx
          git commit -m "fix(live): fail closed when decoded frame never arrives"
          git fetch origin astra/realtime-hardening
          git rebase origin/astra/realtime-hardening
          git push origin HEAD:astra/realtime-hardening
