name: Cleanup live performance scaffolding

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/cleanup-live-performance-scaffolding.json

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coverage-driven-200k
          fetch-depth: 1
      - name: Remove completed one-time workflows
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/patch-live-neighborhood-index-cache.yml \
            data/patch-live-neighborhood-index-cache.json \
            .github/workflows/patch-live-responsive-benchmark.yml \
            data/patch-live-responsive-benchmark.json \
            .github/workflows/patch-live-benchmark-receipt.yml \
            data/patch-live-benchmark-receipt.json \
            .github/workflows/cleanup-live-performance-scaffolding.yml \
            data/cleanup-live-performance-scaffolding.json
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(live): remove one-time performance scaffolding"
          git fetch origin work/coverage-driven-200k
          git rebase origin/work/coverage-driven-200k
          git push origin HEAD:work/coverage-driven-200k
