name: Catalog collection smoke

on:
  pull_request:
    paths:
      - .github/workflows/catalog-collection-smoke.yml
      - tools/coverage-200k-plan.mjs
      - tools/stage-openverse-coverage.mjs
      - tools/curate-coverage-candidates.py
      - tools/build_face_catalog.py
      - tools/finalize-supplement-catalog.mjs
      - tools/validate_face_catalog.mjs
      - tools/requirements-catalog.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'work/coverage-driven-200k'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /tools/*
            /public/seed-catalog/manifest.json
            /public/seed-catalog/shards/*
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt

      - name: Install catalog runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt

      - name: Measure the 70k catalog gaps
        run: |
          mkdir -p work
          node tools/coverage-200k-plan.mjs \
            --manifest public/seed-catalog/manifest.json \
            --target 200000 \
            --output work/coverage-plan.json

      - name: Stage a diverse licensed candidate sample
        run: |
          node tools/stage-openverse-coverage.mjs \
            --plan work/coverage-plan.json \
            --output work/stage \
            --direct true \
            --limit 180 \
            --pages 1 \
            --gaps 24

      - name: Measure pose and visible face configuration
        id: curate
        continue-on-error: true
        run: |
          python tools/curate-coverage-candidates.py \
            work/stage \
            work/accepted \
            --yaw-tolerance 15 \
            --pitch-tolerance 18 \
            --max-files 180

      - name: Build a packed supplement catalog
        if: steps.curate.outcome == 'success'
        run: |
          python tools/build_face_catalog.py \
            work/accepted \
            work/supplement \
            --metadata work/accepted/metadata.csv \
            --yaw-min -45 \
            --yaw-max 45 \
            --pitch-min -36 \
            --pitch-max 36
          node tools/finalize-supplement-catalog.mjs \
            --catalog work/supplement \
            --catalog-id "coverage-smoke-${GITHUB_RUN_ID}"
          node tools/validate_face_catalog.mjs work/supplement | tee work/supplement-validation.json

      - name: Write collection summary
        if: always()
        run: |
          {
            echo "## Coverage-driven collection smoke"
            echo
            echo "This run only creates a reviewable supplement artifact; it does not alter the 70k catalog."
            echo
            if [[ -f work/coverage-plan.json ]]; then
              node -e 'const p=require("./work/coverage-plan.json"); console.log(`- Base searchable faces: ${p.currentFaces.toLocaleString()}`); console.log(`- Target: ${p.targetFaces.toLocaleString()}`); console.log(`- Planned additions: ${p.neededImages.toLocaleString()}`); console.log(`- Gap cells queued: ${p.collectionQueue.length.toLocaleString()}`)'
            fi
            if [[ -f work/stage/state.json ]]; then
              node -e 'const p=require("./work/stage/state.json"); console.log(`- Licensed candidates staged: ${(p.rows||[]).length}`)'
            fi
            if [[ -f work/accepted/curation-report.json ]]; then
              node -e 'const p=require("./work/accepted/curation-report.json"); console.log(`- Measured: ${p.checked}`); console.log(`- Accepted: ${p.accepted}`); console.log(`- Rejected: ${p.rejected}`); console.log(`- Rejection reasons: ${JSON.stringify(p.reasons)}`)'
            fi
            if [[ -f work/supplement/manifest.json ]]; then
              node -e 'const p=require("./work/supplement/manifest.json"); console.log(`- Packed supplement faces: ${p.searchableFaces}`); console.log(`- Pose cells represented: ${Object.keys(p.cells||{}).length}`); console.log(`- Provenance complete: ${p.stats?.provenance?.licensedEntries === p.searchableFaces}`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewable collection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-collection-smoke-${{ github.run_id }}
          path: |
            work/coverage-plan.json
            work/stage/metadata.csv
            work/stage/state.json
            work/accepted/metadata.csv
            work/accepted/curation-report.json
            work/accepted/images
            work/supplement
            work/supplement-validation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require at least one measured match
        if: steps.curate.outcome != 'success'
        run: |
          echo "No candidate passed measured pose/configuration curation. Inspect the uploaded reports before widening any threshold." >&2
          exit 1
