name: Patch live fast-lane telemetry

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/patch-live-fast-lane-telemetry.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coverage-driven-200k
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/public/seed-catalog/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Include direct-ready faces in telemetry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/live-responsive-lab.tsx')
          text = path.read_text(encoding='utf-8')
          if 'urgentReadyCount()' not in text:
              patterns = (
                  'readyImages: bufferStats.readyImages,',
                  'readyImages: bufferStats?.readyImages ?? 0,',
                  'readyImages: imageBufferStats.readyImages,',
                  'readyImages: imageBufferStats?.readyImages ?? 0,',
              )
              found = [pattern for pattern in patterns if pattern in text]
              if len(found) != 1:
                  raise SystemExit(f'Unexpected ready-image telemetry anchors: {found!r}')
              old = found[0]
              base = old.split(':', 1)[1].rsplit(',', 1)[0].strip()
              text = text.replace(
                  old,
                  f'readyImages: ({base}) + (buffer?.urgentReadyCount() ?? 0),',
                  1,
              )
          path.write_text(text, encoding='utf-8')

          config = Path('data/live-realtime-ci.json')
          json = __import__('json')
          payload = json.loads(config.read_text(encoding='utf-8'))
          payload['nonce'] = int(payload.get('nonce', 0)) + 1
          payload['telemetryReadyImages'] = 'pack-plus-direct-v1'
          config.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate telemetry patch
        run: |
          npm ci
          npm run build
          node --experimental-strip-types --test \
            tests/live-matching.test.mjs \
            tests/live-responsive-runtime.test.mjs \
            tests/live-search-cadence.test.mjs \
            tests/live-packed-image-buffer.test.mjs \
            tests/live-responsive-image-buffer.test.mjs \
            tests/catalog-worker.test.mjs
          npm run lint
      - name: Commit telemetry patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/live-responsive-lab.tsx data/live-realtime-ci.json
          git commit -m "chore(live): expose direct-ready image count"
          git fetch origin work/coverage-driven-200k
          git rebase origin/work/coverage-driven-200k
          git push origin HEAD:work/coverage-driven-200k
