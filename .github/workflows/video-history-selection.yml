name: Video history selection experiment
on:
  push:
    branches: [astra/video-history-selection]
    paths: ['app/**', 'tests/**', 'scripts/**', '.github/workflows/video-history-selection.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Pin current full catalog, reference recording and protected source
        run: |
          mkdir -p work/video-history
          git fetch --depth=1 origin 04a41b80469980454758feba9a31ac48b92c11fd
          test "$(git rev-parse HEAD:public/seed-catalog)" = "afcb8f68a8db87424fe5169896be0fd0a57dbf65"
          git diff --exit-code 04a41b80469980454758feba9a31ac48b92c11fd HEAD -- public app worker package.json package-lock.json ':!app/projection-matching.ts' ':!app/live/review-history-selection.ts' ':!app/live/review-search.worker.ts'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          let expected = execFileSync('git', ['show', '04a41b80469980454758feba9a31ac48b92c11fd:app/projection-matching.ts'], {encoding: 'utf8'});
          for (const declaration of ['const COARSE_INDEXES', 'function residualMotionAtIndexes', 'function expressionResidualMotion', 'function sourceExpressionActivity', 'function rareActionPenalty']) expected = expected.replace(declaration, 'export ' + declaration);
          assert.equal(fs.readFileSync('app/projection-matching.ts', 'utf8'), expected, 'Original optimizer and all other projection math must remain unchanged');
          NODE
          npm ci
          npm install --prefix .browser-tools --no-save --package-lock=false playwright@1.56.1
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          mkdir -p /tmp/mf-history-baseline
          git archive 04a41b80469980454758feba9a31ac48b92c11fd | tar -x -C /tmp/mf-history-baseline
          ln -s "$PWD/node_modules" /tmp/mf-history-baseline/node_modules
      - name: Build and regression tests
        run: |
          npm run build > work/video-history/build.log 2>&1 || { cat work/video-history/build.log; exit 1; }
          node --experimental-strip-types --test tests/*.test.mjs > work/video-history/unit.log 2>&1 || { cat work/video-history/unit.log; exit 1; }
          tail -n 12 work/video-history/unit.log
          npm run lint > work/video-history/lint.log 2>&1 || { cat work/video-history/lint.log; exit 1; }
          (cd /tmp/mf-history-baseline && npm run build) > work/video-history/baseline-build.log 2>&1 || { cat work/video-history/baseline-build.log; exit 1; }
      - name: Start exact production builds
        run: |
          PORT=4183 HOST=127.0.0.1 nohup npm start > work/video-history/server.log 2>&1 &
          PORT=4185 HOST=127.0.0.1 nohup bash -c 'cd /tmp/mf-history-baseline && npm start' > work/video-history/baseline-server.log 2>&1 &
          for port in 4183 4185; do
            for attempt in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/api/runtime" > "work/video-history/identity-$port.json"; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/api/runtime"
          done
      - name: Same full video, fixed quality gates and complete selection cost
        run: node --experimental-strip-types scripts/verify-video-history.mjs
      - name: Exploratory feasibility under unchanged per-frame quality limits
        run: node --experimental-strip-types scripts/analyze-history-feasibility.mjs work/video-history/same-video-ranking-snapshot.json.gz work/video-history/feasibility.json
      - name: Existing pending-network cancellation
        env:
          VIDEO_SPEED_REPORT_DIR: work/video-history
        run: node scripts/verify-video-cancellation.mjs
      - name: Preserve source throughout comparison
        if: always()
        run: git diff --exit-code -- app worker scripts tests build public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-history-${{ github.run_id }}
          path: work/video-history
          retention-days: 14
