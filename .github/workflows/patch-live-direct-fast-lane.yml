name: Patch live direct-image fast lane

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/patch-live-direct-fast-lane.json

permissions:
  contents: write

concurrency:
  group: many-faces-patch-live-direct-fast-lane
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coverage-driven-200k
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/public/seed-catalog/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Wire the responsive lab to the cold-pack fast lane
        run: |
          python - <<'PY'
          from pathlib import Path

          lab = Path('app/live-responsive-lab.tsx')
          text = lab.read_text(encoding='utf-8')
          old_paths = (
              'from "./live-packed-image-buffer";',
              'from "./live-packed-image-buffer.ts";',
          )
          if 'live-responsive-image-buffer' not in text:
              for old in old_paths:
                  if old in text:
                      text = text.replace(
                          old,
                          'from "./live-responsive-image-buffer.ts";',
                          1,
                      )
                      break
              else:
                  raise SystemExit('Live packed-image-buffer import was not found')
          lab.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/live-realtime-ci.yml')
          text = workflow.read_text(encoding='utf-8')
          if '      - app/live-responsive-image-buffer.ts\n' not in text:
              anchor = '      - app/live-packed-image-buffer.ts\n'
              if anchor not in text:
                  anchor = '      - app/live-matching.ts\n'
              if anchor not in text:
                  raise SystemExit('Realtime CI path anchor was not found')
              text = text.replace(
                  anchor,
                  anchor + '      - app/live-responsive-image-buffer.ts\n',
                  1,
              )
          if '      - tests/live-responsive-image-buffer.test.mjs\n' not in text:
              anchor = '      - tests/live-packed-image-buffer.test.mjs\n'
              if anchor not in text:
                  anchor = '      - tests/live-matching.test.mjs\n'
              if anchor not in text:
                  raise SystemExit('Realtime CI test-path anchor was not found')
              text = text.replace(
                  anchor,
                  anchor + '      - tests/live-responsive-image-buffer.test.mjs\n',
                  1,
              )
          command = '            tests/live-responsive-image-buffer.test.mjs \\\n'
          if command not in text:
              anchor = '            tests/live-packed-image-buffer.test.mjs \\\n'
              if anchor not in text:
                  anchor = '            tests/live-matching.test.mjs \\\n'
              if anchor not in text:
                  raise SystemExit('Realtime CI test command anchor was not found')
              text = text.replace(anchor, anchor + command, 1)
          workflow.write_text(text, encoding='utf-8')

          config = Path('data/live-realtime-ci.json')
          payload = __import__('json').loads(config.read_text(encoding='utf-8'))
          payload['nonce'] = int(payload.get('nonce', 0)) + 1
          payload['imageFastLane'] = 'direct-range-race-v1'
          config.write_text(
              __import__('json').dumps(payload, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Validate responsive fast lane
        run: |
          npm ci
          npm run build
          node --experimental-strip-types --test \
            tests/live-matching.test.mjs \
            tests/live-responsive-runtime.test.mjs \
            tests/live-packed-image-buffer.test.mjs \
            tests/live-responsive-image-buffer.test.mjs \
            tests/catalog-worker.test.mjs
          npm run lint
      - name: Commit the responsive fast lane
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/live-responsive-lab.tsx \
            .github/workflows/live-realtime-ci.yml \
            data/live-realtime-ci.json
          git commit -m "perf(live): bypass cold packs for urgent faces"
          git fetch origin work/coverage-driven-200k
          git rebase origin/work/coverage-driven-200k
          git push origin HEAD:work/coverage-driven-200k
