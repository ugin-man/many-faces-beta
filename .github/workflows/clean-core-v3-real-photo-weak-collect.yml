name: Collect weak real-photo Clean Core v3 profiles

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/clean-core-v3-real-photo-weak-launch.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: many-faces-clean-core-v3-real-photo-weak-collect
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - id: gate
        shell: bash
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          echo "HEAD subject: ${SUBJECT}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${SUBJECT}" == "chore(dataset): launch weak real-photo collection"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - id: matrix
        run: |
          python - <<'PY'
          import json, os
          matrix = {
            "include": [
              {"id":"openverse-eyes","provider":"openverse","profiles":"winkLeft,winkRight,eyesWide","pages":10,"maxImages":4500},
              {"id":"commons-eyes","provider":"commons","profiles":"winkLeft,winkRight,eyesWide","pages":10,"maxImages":4500},
              {"id":"openverse-round","provider":"openverse","profiles":"noseSneer,mouthRound,mouthUpperUp,mouthLowerDown","pages":10,"maxImages":4500},
              {"id":"commons-round","provider":"commons","profiles":"noseSneer,mouthRound,mouthUpperUp,mouthLowerDown","pages":10,"maxImages":4500},
              {"id":"openverse-asymmetric","provider":"openverse","profiles":"mouthLeft,mouthRight,mouthFrown,mouthWide","pages":10,"maxImages":4500},
              {"id":"commons-asymmetric","provider":"commons","profiles":"mouthLeft,mouthRight,mouthFrown,mouthWide","pages":10,"maxImages":4500},
              {"id":"openverse-openings","provider":"openverse","profiles":"mouthSlightOpen,mouthOpen,smileOpen","pages":10,"maxImages":4500},
              {"id":"commons-openings","provider":"commons","profiles":"mouthSlightOpen,mouthOpen,smileOpen","pages":10,"maxImages":4500}
            ]
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write("value=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PY

  collect:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /tools/*
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt
      - name: Install measurement runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt
      - name: Stage openly licensed real photographs
        run: |
          node tools/stage_real_photo_weak_profiles.mjs \
            --output work/stage \
            --provider '${{ matrix.provider }}' \
            --profiles '${{ matrix.profiles }}' \
            --pages '${{ matrix.pages }}' \
            --per-page 50 \
            --max-images '${{ matrix.maxImages }}'
      - name: Measure strict single-factor states
        run: |
          python tools/curate-clean-core-v3.py \
            work/stage work/curated \
            --min-face-area 0.055 \
            --overwrite
      - name: Keep only genuinely measured weak profiles
        run: |
          python tools/filter_real_photo_weak_profiles.py \
            work/curated work/filtered --overwrite
      - name: Mirror and remeasure useful symmetric/asymmetric states
        run: |
          python tools/mirror_clean_core_pairs.py \
            work/filtered work/expanded --overwrite
          python tools/build_face_catalog_compat.py \
            work/expanded work/supplement \
            --metadata work/expanded/metadata.csv \
            --yaw-min -45 --yaw-max 45 --pitch-min -36 --pitch-max 36 \
            --overwrite
          node tools/finalize-supplement-catalog.mjs \
            --catalog work/supplement \
            --catalog-id 'clean-v3-real-weak-${{ matrix.id }}-${{ github.run_id }}'
          node tools/validate_face_catalog.mjs work/supplement \
            | tee work/supplement-validation.json
      - name: Upload measured real-photo supplement
        uses: actions/upload-artifact@v4
        with:
          name: clean-v3-real-weak-${{ matrix.id }}
          path: |
            work/stage/source-report.json
            work/curated/clean-curation-report.json
            work/filtered/filter-report.json
            work/filtered/review
            work/supplement
            work/supplement-validation.json
          if-no-files-found: error
          retention-days: 21
          compression-level: 6

  summarize:
    needs: [prepare, collect]
    if: needs.prepare.outputs.run == 'true' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clean-v3-real-weak-*
          path: work/artifacts
          merge-multiple: false
      - name: Aggregate measured profile supply
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=Path('work/artifacts')
          profiles=Counter(); staged=0; curated=0; filtered=0; searchable=0
          jobs=[]
          for report_path in sorted(root.glob('*/filter-report.json')):
              job=report_path.parent.name
              filter_report=json.loads(report_path.read_text())
              source_path=report_path.parent/'source-report.json'
              curate_path=report_path.parent/'clean-curation-report.json'
              manifest_path=report_path.parent/'supplement'/'manifest.json'
              source=json.loads(source_path.read_text()) if source_path.exists() else {}
              curate=json.loads(curate_path.read_text()) if curate_path.exists() else {}
              manifest=json.loads(manifest_path.read_text()) if manifest_path.exists() else {}
              staged += int(source.get('staged',0))
              curated += int(curate.get('accepted',0))
              filtered += int(filter_report.get('kept',0))
              searchable += int(manifest.get('searchableFaces',manifest.get('totalFaces',0)) or 0)
              profiles.update({k:int(v) for k,v in filter_report.get('profiles',{}).items()})
              jobs.append({
                  'job':job,
                  'staged':source.get('staged',0),
                  'curated':curate.get('accepted',0),
                  'filtered':filter_report.get('kept',0),
                  'searchableAfterMirroring':manifest.get('searchableFaces',manifest.get('totalFaces',0)),
                  'profiles':filter_report.get('profiles',{}),
              })
          report={
              'schemaVersion':1,
              'workflowRunId':int('${{ github.run_id }}'),
              'headCommit':'${{ github.sha }}',
              'staged':staged,
              'curated':curated,
              'filteredWeakOriginals':filtered,
              'searchableAfterMirroring':searchable,
              'measuredOriginalProfiles':dict(sorted(profiles.items())),
              'jobs':jobs,
              'runtimeImagePolicy':'real-photo-only-v1',
          }
          output=Path('work/summary'); output.mkdir(parents=True,exist_ok=True)
          (output/'weak-real-photo-supply.json').write_text(json.dumps(report,indent=2)+'\n')
          lines=['# Weak real-photo supply', '', f"Workflow run: {report['workflowRunId']}", '',
                 f"Staged: {staged:,}", f"Curated: {curated:,}",
                 f"Measured weak originals: {filtered:,}", f"Searchable after mirroring: {searchable:,}", '',
                 '## Measured original profiles', '']
          lines.extend(f"- {name}: {count:,}" for name,count in sorted(profiles.items()))
          (output/'README.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(report,indent=2))
          if filtered == 0:
              raise SystemExit('No weak real-photo profiles were measured')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clean-v3-real-weak-summary-${{ github.run_id }}
          path: work/summary
          if-no-files-found: error
          retention-days: 21
          compression-level: 6
