name: Product video and sample QA
on:
  push:
    branches: [main, astra/realtime-hardening]
    paths: ['app/**', 'public/demo/**', 'worker/**', 'scripts/verify-demo-composite.mjs', '.github/workflows/demo-face-composite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Prepare public-only fixture and browser
        run: |
          mkdir -p work/demo-evidence public/mediapipe/wasm public/models
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          npm ci
          npm install --prefix .browser-tools --no-save --package-lock=false playwright@1.56.1
          cp -a node_modules/@mediapipe/tasks-vision/wasm/. public/mediapipe/wasm/
          curl -fL --retry 3 --max-time 90 -o public/models/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          ffmpeg -hide_banner -loglevel error -y -i public/demo/many-faces-sample-30fps.mp4 -t 3 -an -c:v libx264 work/public-test-input.mp4
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Validate shipped sample encoding
        run: |
          ffprobe -v error -show_entries stream=codec_type,r_frame_rate,avg_frame_rate,nb_frames -of json public/demo/many-faces-sample-30fps.mp4 > work/demo-evidence/encoding.json
          python - <<'PY'
          import json
          s=json.load(open('work/demo-evidence/encoding.json'))['streams']
          assert len(s)==1 and s[0]['codec_type']=='video'
          assert s[0]['avg_frame_rate']=='30/1' and s[0]['r_frame_rate']=='30/1'
          assert int(s[0]['nb_frames'])==699
          PY
      - name: Build production application
        run: npm run build > work/demo-evidence/build.log 2>&1
      - name: Start production runtime
        run: |
          PORT=4173 HOST=127.0.0.1 nohup npm start > work/demo-evidence/server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify finished sample and normal video workflow
        run: node scripts/verify-demo-composite.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-qa-${{ github.run_id }}
          path: work/demo-evidence/
          retention-days: 7
