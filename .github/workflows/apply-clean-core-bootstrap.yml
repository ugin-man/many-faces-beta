name: Apply clean-core bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - data/clean-core-bootstrap/launch.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'work/coverage-driven-200k'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Decode, validate, and install clean-core implementation
        run: |
          cat data/clean-core-bootstrap/chunk-*.b64 | base64 --decode > /tmp/clean-core-bootstrap.tgz
          echo "65909d0fd5de3ee3817e436dad3e9108f608fca9d962c6b9a1b687a5327fcf5f  /tmp/clean-core-bootstrap.tgz" | sha256sum -c -
          tar -xzf /tmp/clean-core-bootstrap.tgz -C .
          python -m py_compile \
            tools/clean_core_policy.py \
            tools/curate-clean-core-candidates.py \
            tools/build_clean_core.py
          python -m unittest tests/test_clean_core_policy.py

      - name: Commit verified implementation to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/clean-core-v1.yml \
            tools/clean_core_policy.py \
            tools/curate-clean-core-candidates.py \
            tools/build_clean_core.py \
            tests/test_clean_core_policy.py \
            data/clean-core-v1-spec.json \
            docs/CLEAN_CORE_V1.md
          git rm -r -- data/clean-core-bootstrap .github/workflows/apply-clean-core-bootstrap.yml
          git commit -m "feat(dataset): add isolated clean core v1 pipeline"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
