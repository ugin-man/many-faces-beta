name: Collect weak real-photo Clean Core v3 profiles v2

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/clean-core-v3-real-photo-weak-v2-launch.json
  pull_request:
    branches: [main]
    paths:
      - data/clean-core-v3-real-photo-weak-v2-launch.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: many-faces-clean-core-v3-real-photo-weak-collect
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        shell: bash
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          echo "HEAD subject: ${SUBJECT}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${SUBJECT}" == "chore(dataset): launch concurrent weak real-photo collection"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - id: matrix
        run: |
          python - <<'PY'
          import json, os
          matrix={"include":[
            {"id":"openverse-eyes","provider":"openverse","profiles":"winkLeft,winkRight,eyesWide","pages":7,"maxImages":2500},
            {"id":"commons-eyes","provider":"commons","profiles":"winkLeft,winkRight,eyesWide","pages":7,"maxImages":2500},
            {"id":"openverse-round","provider":"openverse","profiles":"noseSneer,mouthRound,mouthUpperUp,mouthLowerDown","pages":7,"maxImages":2500},
            {"id":"commons-round","provider":"commons","profiles":"noseSneer,mouthRound,mouthUpperUp,mouthLowerDown","pages":7,"maxImages":2500},
            {"id":"openverse-asymmetric","provider":"openverse","profiles":"mouthLeft,mouthRight,mouthFrown,mouthWide","pages":7,"maxImages":2500},
            {"id":"commons-asymmetric","provider":"commons","profiles":"mouthLeft,mouthRight,mouthFrown,mouthWide","pages":7,"maxImages":2500},
            {"id":"openverse-openings","provider":"openverse","profiles":"mouthSlightOpen,mouthOpen,smileOpen","pages":7,"maxImages":2500},
            {"id":"commons-openings","provider":"commons","profiles":"mouthSlightOpen,mouthOpen,smileOpen","pages":7,"maxImages":2500}
          ]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write('value='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY

  collect:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /tools/*
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt
      - name: Install measurement runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt
      - name: Concurrently stage openly licensed real photographs
        run: |
          python tools/collect_real_photo_weak_profiles.py \
            work/stage \
            --provider '${{ matrix.provider }}' \
            --profiles '${{ matrix.profiles }}' \
            --pages '${{ matrix.pages }}' \
            --per-page 50 \
            --max-images '${{ matrix.maxImages }}' \
            --workers 24 \
            --overwrite
      - name: Measure strict single-factor states
        run: |
          python tools/curate-clean-core-v3.py \
            work/stage work/curated \
            --min-face-area 0.055 \
            --overwrite
      - name: Keep only genuinely measured weak profiles
        run: |
          python tools/filter_real_photo_weak_profiles.py \
            work/curated work/filtered --overwrite || true
      - name: Build a supplement when the measured supply is nonzero
        shell: bash
        run: |
          KEEP=$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('work/filtered/filter-report.json')
          print(int(json.loads(path.read_text()).get('kept',0)) if path.exists() else 0)
          PY
          )
          echo "Measured weak originals: ${KEEP}"
          if [[ "${KEEP}" -gt 0 ]]; then
            python tools/mirror_clean_core_pairs.py work/filtered work/expanded --overwrite
            python tools/build_face_catalog_compat.py \
              work/expanded work/supplement \
              --metadata work/expanded/metadata.csv \
              --yaw-min -45 --yaw-max 45 --pitch-min -36 --pitch-max 36 \
              --overwrite
            node tools/finalize-supplement-catalog.mjs \
              --catalog work/supplement \
              --catalog-id 'clean-v3-real-weak-v2-${{ matrix.id }}-${{ github.run_id }}'
            node tools/validate_face_catalog.mjs work/supplement \
              | tee work/supplement-validation.json
          fi
      - name: Prepare a stable artifact layout
        run: |
          mkdir -p work/export
          cp work/stage/source-report.json work/export/
          cp work/curated/clean-curation-report.json work/export/
          cp work/filtered/filter-report.json work/export/
          cp -a work/filtered/review work/export/review
          if [[ -d work/supplement ]]; then cp -a work/supplement work/export/supplement; fi
          if [[ -f work/supplement-validation.json ]]; then cp work/supplement-validation.json work/export/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: clean-v3-real-weak-v2-${{ matrix.id }}
          path: work/export
          if-no-files-found: error
          retention-days: 21
          compression-level: 6

  summarize:
    needs: [prepare, collect]
    if: needs.prepare.outputs.run == 'true' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clean-v3-real-weak-v2-*
          path: work/artifacts
          merge-multiple: false
      - name: Aggregate measured real-photo supply
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=Path('work/artifacts')
          profiles=Counter(); staged=curated=filtered=searchable=0; jobs=[]
          for report_path in sorted(root.glob('*/filter-report.json')):
              job=report_path.parent.name
              f=json.loads(report_path.read_text())
              s=json.loads((report_path.parent/'source-report.json').read_text())
              c=json.loads((report_path.parent/'clean-curation-report.json').read_text())
              mpath=report_path.parent/'supplement'/'manifest.json'
              m=json.loads(mpath.read_text()) if mpath.exists() else {}
              staged += int(s.get('staged',0)); curated += int(c.get('accepted',0)); filtered += int(f.get('kept',0))
              searchable += int(m.get('searchableFaces',m.get('totalFaces',0)) or 0)
              profiles.update({k:int(v) for k,v in f.get('profiles',{}).items()})
              jobs.append({'job':job,'staged':s.get('staged',0),'curated':c.get('accepted',0),'filtered':f.get('kept',0),'searchableAfterMirroring':m.get('searchableFaces',m.get('totalFaces',0)),'profiles':f.get('profiles',{})})
          report={'schemaVersion':2,'workflowRunId':int('${{ github.run_id }}'),'headCommit':'${{ github.event.pull_request.head.sha || github.sha }}','staged':staged,'curated':curated,'filteredWeakOriginals':filtered,'searchableAfterMirroring':searchable,'measuredOriginalProfiles':dict(sorted(profiles.items())),'jobs':jobs,'runtimeImagePolicy':'real-photo-only-v1'}
          out=Path('work/summary'); out.mkdir(parents=True,exist_ok=True)
          (out/'weak-real-photo-supply.json').write_text(json.dumps(report,indent=2)+'\n')
          lines=['# Weak real-photo supply v2','',f"Workflow run: {report['workflowRunId']}",'',f"Staged: {staged:,}",f"Curated: {curated:,}",f"Measured weak originals: {filtered:,}",f"Searchable after mirroring: {searchable:,}",'','## Measured original profiles','']
          lines.extend(f"- {name}: {count:,}" for name,count in sorted(profiles.items()))
          (out/'README.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(report,indent=2))
          if filtered == 0: raise SystemExit('No weak real-photo profiles were measured')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clean-v3-real-weak-v2-summary-${{ github.run_id }}
          path: work/summary
          if-no-files-found: error
          retention-days: 21
          compression-level: 6
