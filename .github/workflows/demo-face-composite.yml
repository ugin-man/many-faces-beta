name: Demo face composite browser QA
on:
  push:
    branches: [astra/realtime-hardening]
    paths:
      - '.github/workflows/demo-face-composite.yml'
      - 'app/demo/**'
      - 'app/live/demo-client.tsx'
      - 'app/demo-face-composite.ts'
      - 'scripts/verify-demo-composite.mjs'
      - 'tests/demo-face-composite.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Prepare full original assets and browser
        run: |
          mkdir -p work/demo-evidence public/mediapipe/wasm public/models
          npm ci
          npm install --prefix .browser-tools --no-save --package-lock=false playwright@1.56.1
          cp -a node_modules/@mediapipe/tasks-vision/wasm/. public/mediapipe/wasm/
          curl -fL --retry 3 --max-time 90 -o public/models/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Build production application
        run: npm run build > work/demo-evidence/build.log 2>&1
      - name: Start full production runtime
        run: |
          PORT=4173 HOST=127.0.0.1 nohup npm start > work/demo-evidence/server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/demo > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify original-face masking, image save and recorded video
        run: node scripts/verify-demo-composite.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-composite-qa-${{ github.run_id }}
          path: work/demo-evidence/
          retention-days: 14
