name: Apply clean core v2 bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - data/clean-core-v2-bootstrap/launch.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'work/coverage-driven-200k'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Decode, validate, and install Clean Core v2
        run: |
          cat data/clean-core-v2-bootstrap/part-*.b64 | base64 --decode > /tmp/clean-core-v2.tgz
          tar -xzf /tmp/clean-core-v2.tgz -C .
          python -m py_compile \
            tools/clean_core_policy_v2.py \
            tools/curate-clean-core-v2.py \
            tools/build_clean_core_v2.py \
            tools/mirror_clean_core_pairs.py
          node --check tools/stage_clean_core_targets.mjs
          python -m unittest tests/test_clean_core_policy_v2.py
          python -m json.tool data/clean-core-v2-spec.json >/dev/null
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/clean-core-v2.yml \
            tools/clean_core_policy_v2.py \
            tools/curate-clean-core-v2.py \
            tools/build_clean_core_v2.py \
            tools/stage_clean_core_targets.mjs \
            tools/mirror_clean_core_pairs.py \
            tests/test_clean_core_policy_v2.py \
            data/clean-core-v2-spec.json
          git rm -r -- data/clean-core-v2-bootstrap .github/workflows/apply-clean-core-v2-bootstrap.yml
          git commit -m "feat(dataset): build honest 70k clean core v2"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
