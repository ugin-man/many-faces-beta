name: Realtime lab CI

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - app/live/**
      - app/live-faithful-lab.tsx
      - app/live-faithful-lab.module.css
      - app/live-faithful-sequence.ts
      - app/live-face-lab.tsx
      - app/live-face-lab.module.css
      - app/live-responsive-lab.tsx
      - app/live-responsive-lab.module.css
      - app/live-responsive-runtime.ts
      - app/live-packed-image-buffer.ts
      - app/live-matching.ts
      - app/projection-matching.ts
      - app/offline-matching.ts
      - app/mode-nav.tsx
      - app/mode-nav.module.css
      - app/layout.tsx
      - public/faithful-capture-worker-v2.js
      - tools/patch_faithful_camera_start.py
      - worker/index.ts
      - tests/catalog-worker.test.mjs
      - tests/live-matching.test.mjs
      - tests/live-responsive-runtime.test.mjs
      - tests/live-packed-image-buffer.test.mjs
      - tests/live-faithful-sequence.test.mjs
      - tests/live-faithful-delay.test.mjs
      - tests/live-faithful-startup.test.mjs
      - data/live-realtime-ci.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/public/seed-catalog/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false
      - name: Allow camera capture before analyzer readiness
        run: python tools/patch_faithful_camera_start.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm ci
      - id: build
        name: Build realtime routes
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - id: tests
        name: Run realtime, faithful FIFO, startup, and catalog delivery tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node --check public/faithful-capture-worker-v2.js
          node --experimental-strip-types --test \
            tests/live-matching.test.mjs \
            tests/live-responsive-runtime.test.mjs \
            tests/live-packed-image-buffer.test.mjs \
            tests/live-faithful-sequence.test.mjs \
            tests/live-faithful-delay.test.mjs \
            tests/live-faithful-startup.test.mjs \
            tests/catalog-worker.test.mjs
      - id: lint
        name: Lint application
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - name: Write verification receipt
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          outcomes = {
              'install': os.environ.get('INSTALL_OUTCOME', 'missing'),
              'build': os.environ.get('BUILD_OUTCOME', 'missing'),
              'tests': os.environ.get('TEST_OUTCOME', 'missing'),
              'lint': os.environ.get('LINT_OUTCOME', 'missing'),
          }
          receipt = {
              'schemaVersion': 5,
              'testedCommit': '${{ github.sha }}',
              'workflowRunId': int('${{ github.run_id }}'),
              'route': '/live',
              'fastRoute': '/live/fast',
              'pipeline': 'offline-faithful-fifo-v2',
              'captureTargetFps': 30,
              'captureGeometry': 'full-frame-aspect-preserved',
              'cameraStartPolicy': 'capture-before-catalog-and-model-ready',
              'queuedFrameReadinessPolicy': 'hold-until-landmarker-and-catalog-ready',
              'frameDroppingPolicy': 'no-intentional-drop-after-camera-capture',
              'matching': 'offline-strict-two-stage-projection',
              'sequence': 'offline-strict-streaming-equivalent-with-configurable-lookahead',
              'displayPolicy': 'decode-and-paint-barrier-before-next-analysis-frame',
              'lookaheadSeconds': [0, 3, 10],
              'outcomes': outcomes,
              'passed': all(value == 'success' for value in outcomes.values()),
          }
          Path('data/live-realtime-ci-result.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2))
          PY
      - name: Commit patched source and verification receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/live/faithful-client.tsx data/live-realtime-ci-result.json
          git commit -m "fix(live): enable camera while faithful analyzer prepares" || exit 0
          git fetch origin work/coverage-driven-200k
          git rebase origin/work/coverage-driven-200k
          git push origin HEAD:work/coverage-driven-200k
      - name: Fail unsuccessful verification
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          for outcome in "$INSTALL_OUTCOME" "$BUILD_OUTCOME" "$TEST_OUTCOME" "$LINT_OUTCOME"; do
            [[ "$outcome" == "success" ]] || exit 1
          done
