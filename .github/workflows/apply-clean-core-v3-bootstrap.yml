name: Apply clean core v3 bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - data/clean-core-v3-bootstrap/launch.json

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'work/coverage-driven-200k'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Decode and validate Clean Core v3
        run: |
          cat data/clean-core-v3-bootstrap/part-*.b64 | base64 --decode > /tmp/clean-core-v3.tgz
          tar -xzf /tmp/clean-core-v3.tgz -C .
          python -m py_compile \
            tools/clean_core_policy_v3.py \
            tools/curate-clean-core-v3.py \
            tools/build_clean_core_v3.py \
            tools/stage_synthetic_facs.py
          python -m unittest tests/test_clean_core_policy_v3.py
          python -m json.tool data/clean-core-v3-spec.json >/dev/null
      - name: Commit verified engine and specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tools/clean_core_policy_v3.py \
            tools/curate-clean-core-v3.py \
            tools/build_clean_core_v3.py \
            tools/stage_synthetic_facs.py \
            tests/test_clean_core_policy_v3.py \
            data/clean-core-v3-spec.json
          git rm -r -- data/clean-core-v3-bootstrap
          git commit -m "feat(dataset): add honest 70k clean core v3 engine"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
