name: Apply isolated audit repairs once
on:
  push:
    branches: [work/audit-overhaul-20260905]
    paths: [.github/workflows/audit-apply-once.yml]
permissions:
  contents: write
concurrency:
  group: audit-apply-once
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply anchor-checked source migration
        run: python .github/scripts/audit-overhaul-once.py
      - name: Pin compatible security updates and official runtime types
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json');v=json.loads(p.read_text())
          v['dependencies'].update({'@mediapipe/tasks-vision':'1.0.1','next':'16.2.11','react':'19.2.8','react-dom':'19.2.8'})
          v['devDependencies'].update({'react-server-dom-webpack':'19.2.8','eslint-config-next':'16.2.11','vite':'8.0.16'})
          v['scripts'].update({'typecheck':'tsc --noEmit','test:unit':'node --experimental-strip-types --test tests/*.test.mjs'})
          p.write_text(json.dumps(v,indent=2)+'\n')
          p=Path('tsconfig.json');v=json.loads(p.read_text());v['compilerOptions']['types']=['node','@cloudflare/workers-types'];p.write_text(json.dumps(v,indent=2)+'\n')
          PY
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact @cloudflare/workers-types@4.20260702.1 > /tmp/audit-install.log 2>&1 || { tail -60 /tmp/audit-install.log; exit 1; }
      - name: Save reviewable source and lockfile on the isolated branch
        run: |
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app worker tests package.json package-lock.json tsconfig.json
          git commit -m 'fix(audit): fail-closed catalog, cancellable review, decoded-frame barrier and type contracts'
          git push origin HEAD:work/audit-overhaul-20260905
      - name: Test the committed tree without applying any further patches
        run: |
          mkdir -p work/audit-repairs
          python - <<'PY'
          import json,subprocess,pathlib,time
          out=pathlib.Path('work/audit-repairs');checks={}
          commands={'install':['npm','ci'],'build':['npm','run','build'],'types':['npm','run','typecheck'],'tests':['npm','run','test:unit'],'lint':['npm','run','lint'],'audit':['npm','audit','--json']}
          for name,args in commands.items():
            started=time.monotonic()
            with (out/(name+'.log')).open('w') as log:
              try: code=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT,timeout=300).returncode
              except subprocess.TimeoutExpired: code=124
            text=(out/(name+'.log')).read_text(errors='replace');checks[name]={'exitCode':code,'seconds':round(time.monotonic()-started,2)}
            print('CHECK',name,checks[name],flush=True)
            if name=='audit':
              try:
                v=json.loads(text);print('AUDIT',json.dumps({'metadata':v.get('metadata'),'packages':{k:{f:x.get(f) for f in ['severity','isDirect','fixAvailable']} for k,x in v.get('vulnerabilities',{}).items()}}))
              except Exception: print(text[-2000:])
            elif name=='tests':
              lines=text.splitlines()
              for i,line in enumerate(lines):
                if line.startswith('not ok') or 'CATALOG_AUDIT' in line: print('\n'.join(lines[i:i+32]))
              print('\n'.join(lines[-12:]))
            else: print('\n'.join(text.splitlines()[-80:]))
            if name=='install' and code: break
          report={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'checks':checks}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('COMMITTED_TREE_REPORT',json.dumps(report))
          if any(checks.get(k,{}).get('exitCode',1) for k in ['install','build','types','tests','lint']): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-repair-evidence-${{ github.run_id }}
          path: work/audit-repairs
          retention-days: 14
