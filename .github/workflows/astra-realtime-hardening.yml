name: Astra realtime hardening
on:
  push:
    branches: [astra/realtime-hardening]
    paths: ['app/**', 'worker/**', 'tests/**', 'scripts/**', 'tools/**', 'package*.json', '.github/workflows/astra-realtime-hardening.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-realtime-hardening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/public/seed-catalog/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - id: install
        run: npm ci
      - id: build
        run: npm run build
      - id: tests
        run: node --experimental-strip-types --test tests/astra-*.test.mjs tests/live-responsive-runtime.test.mjs tests/live-review-timeline.test.mjs tests/catalog-worker.test.mjs
      - id: lint
        run: npm run lint
      - name: Write factual receipt
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          outcomes = {k.lower(): os.environ[k] for k in ['INSTALL','BUILD','TESTS','LINT']}
          Path('artifacts/checks.json').write_text(json.dumps({
              'testedCommit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'sourceModifiedByCI': False,
              'catalogTarget': 'full-70000',
              'outcomes': outcomes,
              'passed': all(v == 'success' for v in outcomes.values()),
              'physicalCameraVerified': False,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-checks-${{ github.run_id }}
          path: artifacts/checks.json
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Prepare full-catalog app and browser driver
        run: |
          npm ci
          npm install --prefix .browser-tools --no-save --package-lock=false playwright@1.56.1
          mkdir -p public/mediapipe/wasm public/models work/astra-fixtures work/astra-evidence
          cp -a node_modules/@mediapipe/tasks-vision/wasm/. public/mediapipe/wasm/
          curl --fail --location --retry 3 --max-time 180 -o public/models/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Audit the full 70k asset as-is
        run: python tools/audit_astra_catalog.py public/seed-catalog --output work/astra-evidence/catalog-audit.json
      - name: Generate virtual-camera fixture from existing real catalog photographs
        run: bash scripts/prepare-astra-fixtures.sh > work/astra-evidence/fixture-build.log 2>&1
      - name: Build the full production route without source patches
        run: npm run build
      - name: Start the full production Site runtime
        run: |
          PORT=4173 HOST=127.0.0.1 nohup npm start > work/astra-evidence/production-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/live/astra > /dev/null; then exit 0; fi
            sleep 1
          done
          cat work/astra-evidence/production-server.log
          exit 1
      - name: Verify realtime behavior against the full 70k catalog
        env:
          MANY_FACES_BASE_URL: http://127.0.0.1:4173
          MANY_FACES_BROWSER_REPORT_DIR: work/astra-evidence/production
        run: node scripts/verify-astra-browser.mjs
      - name: Profile full-catalog network and resource pressure
        env:
          MANY_FACES_BASE_URL: http://127.0.0.1:4173
          MANY_FACES_BROWSER_REPORT_DIR: work/astra-evidence/production
        run: node scripts/profile-astra-resources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-full-catalog-browser-evidence-${{ github.run_id }}
          path: work/astra-evidence
          retention-days: 14
      - name: Confirm the tested source was not rewritten by CI
        run: git diff --exit-code -- app scripts tests tools
