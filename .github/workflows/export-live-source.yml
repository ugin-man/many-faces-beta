name: Export live source

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/export-live-source.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/public/seed-catalog/packs/*
            !/public/seed-catalog/shards/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false
      - name: Pack editable source
        run: |
          tar \
            --exclude=.git \
            --exclude=.next \
            --exclude=dist \
            --exclude=node_modules \
            --exclude=.sites-runtime \
            -czf live-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: many-faces-live-source-${{ github.run_id }}
          path: live-source.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Record export run
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('data/export-live-source-result.json').write_text(
              json.dumps({
                  'schemaVersion': 1,
                  'workflowRunId': int('${{ github.run_id }}'),
                  'headCommit': '${{ github.sha }}',
                  'artifactName': 'many-faces-live-source-${{ github.run_id }}',
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/export-live-source-result.json
          git commit -m "chore(dev): record live source export" || exit 0
          git fetch origin work/coverage-driven-200k
          git rebase origin/work/coverage-driven-200k
          git push origin HEAD:work/coverage-driven-200k
