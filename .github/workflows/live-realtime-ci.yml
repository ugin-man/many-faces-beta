name: Realtime lab CI

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - app/live/**
      - app/live-face-lab.tsx
      - app/live-face-lab.module.css
      - app/live-responsive-lab.tsx
      - app/live-responsive-lab.module.css
      - app/live-responsive-runtime.ts
      - app/live-packed-image-buffer.ts
      - app/live-matching.ts
      - app/mode-nav.tsx
      - app/mode-nav.module.css
      - app/layout.tsx
      - worker/index.ts
      - tests/catalog-worker.test.mjs
      - tests/live-matching.test.mjs
      - tests/live-responsive-runtime.test.mjs
      - tests/live-packed-image-buffer.test.mjs
      - data/live-realtime-ci.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/public/seed-catalog/*
            /public/seed-catalog/manifest.json
          sparse-checkout-cone-mode: false
      - name: Apply static-search optimization once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/live-responsive-lab.tsx')
          text = path.read_text(encoding='utf-8')
          if 'shouldRunLiveSearch' in text and 'lastSearchStatsRef' in text:
              print('Static-search optimization already applied.')
              raise SystemExit(0)

          old_import = '''import {
            predictedPoseDegrees,
            ResponsiveSwitchController,
            selectReadyRankedCandidate,
          } from "./live-responsive-runtime";
          '''
          new_import = '''import {
            predictedPoseDegrees,
            ResponsiveSwitchController,
            selectReadyRankedCandidate,
            shouldRunLiveSearch,
          } from "./live-responsive-runtime";
          '''
          if old_import not in text:
              raise SystemExit('responsive runtime import marker not found')
          text = text.replace(old_import, new_import, 1)

          old_refs = '''  const targetDetectionFpsRef = useRef(DESKTOP_DETECTION_FPS);
            const maxOutputRateRef = useRef(20);
          '''
          new_refs = '''  const targetDetectionFpsRef = useRef(DESKTOP_DETECTION_FPS);
            const maxOutputRateRef = useRef(20);
            const lastSearchStatsRef = useRef({
              searchMs: 0,
              inspected: 0,
              bucketHits: 0,
            });
          '''
          if old_refs not in text:
              raise SystemExit('search stats ref marker not found')
          text = text.replace(old_refs, new_refs, 1)

          old_reset = '''    lastDetectionAtRef.current = 0;
            lastFeatureAtRef.current = 0;
            recentIdsRef.current = [];
          '''
          new_reset = '''    lastDetectionAtRef.current = 0;
            lastFeatureAtRef.current = 0;
            lastSearchStatsRef.current = { searchMs: 0, inspected: 0, bucketHits: 0 };
            recentIdsRef.current = [];
          '''
          if old_reset not in text:
              raise SystemExit('tracking reset marker not found')
          text = text.replace(old_reset, new_reset, 1)

          old_block = '''      void loadCatalogNeighborhood(
                smoothedFeature[0] * 90,
                smoothedFeature[1] * 90,
                predicted.yaw,
                predicted.pitch,
              );

              const searchStarted = performance.now();
              const ranked = rankLiveCandidates(
                candidateIndexRef.current,
                { feature: smoothedFeature, geometry: smoothedGeometry },
                {
                  mode: modeRef.current,
                  budget: RANK_BUDGET,
                  detailedLimit: DETAILED_LIMIT,
                  currentId: currentRef.current?.id,
                  recentIds: recentIdsRef.current,
                  holdBias: 0.001,
                  diversityPenalty: 0.004,
                  hysteresis: 0.001,
                },
              );
              const searchMs = performance.now() - searchStarted;
              const candidates = ranked.ranked.map((item) => item.candidate);
              const buffer = imageBufferRef.current;
              if (buffer && candidates.length) {
                void buffer.prime(candidates, {
                  maxImages: 36,
                  maxNewPacks: 2,
                });
              }

              const decision = switchControllerRef.current.observe(
                now,
                smoothedFeature,
                maxOutputRateRef.current,
              );
              const selected = buffer
                ? selectReadyRankedCandidate(
                    ranked.ranked,
                    (candidate) => buffer.isReady(candidate),
                    currentRef.current?.id ?? null,
                    recentIdsRef.current.slice(0, 4),
                  )
                : null;

              if (!currentRef.current && ranked.ranked[0] && buffer) {
                const first = ranked.ranked[0].candidate;
                if (buffer.isReady(first)) {
                  showReadyCandidate(first, now);
                } else {
                  void buffer.ensure(first).then((url) => {
                    if (url && trackingRef.current && !currentRef.current) {
                      showReadyCandidate(first, performance.now());
                    }
                  });
                }
              } else if (
                decision.shouldSwitch &&
                selected &&
                selected.candidate.id !== currentRef.current?.id
              ) {
                showReadyCandidate(selected.candidate, now);
              }

              updateTelemetry(
                now,
                searchMs,
                ranked.inspected,
                ranked.bucketHits,
                decision.targetRate,
                decision.total,
              );
          '''
          new_block = '''      const decision = switchControllerRef.current.observe(
                now,
                smoothedFeature,
                maxOutputRateRef.current,
              );
              let { searchMs, inspected, bucketHits } = lastSearchStatsRef.current;

              if (shouldRunLiveSearch(currentRef.current?.id ?? null, decision)) {
                void loadCatalogNeighborhood(
                  smoothedFeature[0] * 90,
                  smoothedFeature[1] * 90,
                  predicted.yaw,
                  predicted.pitch,
                );

                const searchStarted = performance.now();
                const ranked = rankLiveCandidates(
                  candidateIndexRef.current,
                  { feature: smoothedFeature, geometry: smoothedGeometry },
                  {
                    mode: modeRef.current,
                    budget: RANK_BUDGET,
                    detailedLimit: DETAILED_LIMIT,
                    currentId: currentRef.current?.id,
                    recentIds: recentIdsRef.current,
                    holdBias: 0.001,
                    diversityPenalty: 0.004,
                    hysteresis: 0.001,
                  },
                );
                searchMs = performance.now() - searchStarted;
                inspected = ranked.inspected;
                bucketHits = ranked.bucketHits;
                lastSearchStatsRef.current = { searchMs, inspected, bucketHits };

                const candidates = ranked.ranked.map((item) => item.candidate);
                const buffer = imageBufferRef.current;
                if (buffer && candidates.length) {
                  void buffer.prime(candidates, {
                    maxImages: 36,
                    maxNewPacks: 2,
                  });
                }

                const selected = buffer
                  ? selectReadyRankedCandidate(
                      ranked.ranked,
                      (candidate) => buffer.isReady(candidate),
                      currentRef.current?.id ?? null,
                      recentIdsRef.current.slice(0, 4),
                    )
                  : null;

                if (!currentRef.current && ranked.ranked[0] && buffer) {
                  const first = ranked.ranked[0].candidate;
                  if (buffer.isReady(first)) {
                    showReadyCandidate(first, now);
                  } else {
                    void buffer.ensure(first).then((url) => {
                      if (url && trackingRef.current && !currentRef.current) {
                        showReadyCandidate(first, performance.now());
                      }
                    });
                  }
                } else if (
                  decision.shouldSwitch &&
                  selected &&
                  selected.candidate.id !== currentRef.current?.id
                ) {
                  showReadyCandidate(selected.candidate, now);
                }
              }

              updateTelemetry(
                now,
                searchMs,
                inspected,
                bucketHits,
                decision.targetRate,
                decision.total,
              );
          '''
          if old_block not in text:
              raise SystemExit('live ranking block marker not found')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm ci
      - id: build
        name: Build realtime route
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - id: tests
        name: Run realtime and catalog delivery tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node --experimental-strip-types --test \
            tests/live-matching.test.mjs \
            tests/live-responsive-runtime.test.mjs \
            tests/live-packed-image-buffer.test.mjs \
            tests/catalog-worker.test.mjs
      - id: lint
        name: Lint application
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - name: Write verification receipt
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          outcomes = {
              'install': os.environ.get('INSTALL_OUTCOME', 'missing'),
              'build': os.environ.get('BUILD_OUTCOME', 'missing'),
              'tests': os.environ.get('TEST_OUTCOME', 'missing'),
              'lint': os.environ.get('LINT_OUTCOME', 'missing'),
          }
          receipt = {
              'schemaVersion': 2,
              'testedCommit': '${{ github.sha }}',
              'workflowRunId': int('${{ github.run_id }}'),
              'route': '/live',
              'pipeline': 'motion-driven-packed-buffer-v2',
              'targetMovingOutputFps': [10, 20],
              'staticBehavior': 'hold-current-face-and-skip-ranking',
              'outcomes': outcomes,
              'passed': all(value == 'success' for value in outcomes.values()),
          }
          Path('data/live-realtime-ci-result.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2))
          PY
      - name: Commit verification receipt and optimized live source
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/live-responsive-lab.tsx data/live-realtime-ci-result.json
          git commit -m "perf(live): skip ranking while static" || exit 0
          git fetch origin work/coverage-driven-200k
          git rebase origin/work/coverage-driven-200k
          git push origin HEAD:work/coverage-driven-200k
      - name: Fail unsuccessful verification
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          for outcome in "$INSTALL_OUTCOME" "$BUILD_OUTCOME" "$TEST_OUTCOME" "$LINT_OUTCOME"; do
            [[ "$outcome" == "success" ]] || exit 1
          done
