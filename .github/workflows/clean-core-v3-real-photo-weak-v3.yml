name: Enrich weak real-photo Clean Core v3 profiles

on:
  push:
    branches: [work/coverage-driven-200k]
    paths:
      - data/clean-core-v3-real-photo-weak-v3-launch.json
  pull_request:
    branches: [main]
    paths:
      - data/clean-core-v3-real-photo-weak-v3-launch.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: many-faces-clean-core-v3-real-photo-weak-collect
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        shell: bash
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          echo "HEAD subject: ${SUBJECT}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${SUBJECT}" == "chore(dataset): launch bounded weak-profile enrichment"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - id: matrix
        run: |
          python - <<'PY'
          import json, os
          matrix={"include":[
            {"id":"eyes","profiles":"winkLeft,winkRight,eyesWide","maxImages":1200},
            {"id":"round","profiles":"noseSneer,mouthRound,mouthUpperUp,mouthLowerDown","maxImages":1200},
            {"id":"asymmetric","profiles":"mouthLeft,mouthRight,mouthFrown,mouthWide","maxImages":1200},
            {"id":"openings","profiles":"mouthSlightOpen,mouthOpen,smileOpen","maxImages":1200}
          ]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write('value='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY

  collect:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /tools/*
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-catalog.txt
      - name: Install measurement runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2
          python -m pip install --disable-pip-version-check -r tools/requirements-catalog.txt
      - name: Stage a bounded Openverse photograph pass
        run: |
          python tools/collect_real_photo_weak_profiles.py \
            work/stage \
            --provider openverse \
            --profiles '${{ matrix.profiles }}' \
            --pages 1 \
            --per-page 80 \
            --max-images '${{ matrix.maxImages }}' \
            --workers 24 \
            --overwrite
      - name: Measure strict single-factor states
        run: |
          python tools/curate-clean-core-v3.py \
            work/stage work/curated \
            --min-face-area 0.045 \
            --overwrite || true
      - name: Keep only genuinely measured weak profiles
        run: |
          python tools/filter_real_photo_weak_profiles.py \
            work/curated work/filtered --overwrite || true
      - name: Build a real-photo supplement when supply exists
        shell: bash
        run: |
          KEEP=$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('work/filtered/filter-report.json')
          print(int(json.loads(path.read_text()).get('kept',0)) if path.exists() else 0)
          PY
          )
          echo "Measured weak originals: ${KEEP}"
          if [[ "${KEEP}" -gt 0 ]]; then
            python tools/mirror_clean_core_pairs.py work/filtered work/expanded --overwrite
            python tools/build_face_catalog_compat.py \
              work/expanded work/supplement \
              --metadata work/expanded/metadata.csv \
              --yaw-min -45 --yaw-max 45 --pitch-min -36 --pitch-max 36 \
              --overwrite
            node tools/finalize-supplement-catalog.mjs \
              --catalog work/supplement \
              --catalog-id 'clean-v3-real-weak-v3-${{ matrix.id }}-${{ github.run_id }}'
            node tools/validate_face_catalog.mjs work/supplement \
              | tee work/supplement-validation.json
          fi
      - name: Prepare a stable artifact layout
        run: |
          mkdir -p work/export
          cp work/stage/source-report.json work/export/
          if [[ -f work/curated/clean-curation-report.json ]]; then cp work/curated/clean-curation-report.json work/export/; fi
          if [[ -f work/filtered/filter-report.json ]]; then cp work/filtered/filter-report.json work/export/; fi
          if [[ -d work/filtered/review ]]; then cp -a work/filtered/review work/export/review; fi
          if [[ -d work/supplement ]]; then cp -a work/supplement work/export/supplement; fi
          if [[ -f work/supplement-validation.json ]]; then cp work/supplement-validation.json work/export/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: clean-v3-real-weak-v3-${{ matrix.id }}
          path: work/export
          if-no-files-found: error
          retention-days: 21
          compression-level: 6

  promote:
    needs: [prepare, collect]
    if: needs.prepare.outputs.run == 'true' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install assembly runtime
        run: |
          python -m pip install --disable-pip-version-check numpy Pillow
          python -m unittest tests/test_clean_core_policy_v3.py tests/test_clean_core_repair_selector.py
      - uses: actions/download-artifact@v4
        with:
          pattern: clean-v3-real-weak-v3-*
          path: work/weak-artifacts
          merge-multiple: false
      - name: Audit measured supply before rebuilding
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=Path('work/weak-artifacts')
          measured=Counter(); supplements=[]; staged=accepted=0
          for artifact in sorted(root.iterdir() if root.exists() else []):
              fpath=artifact/'filter-report.json'; cpath=artifact/'clean-curation-report.json'; spath=artifact/'source-report.json'; mpath=artifact/'supplement'/'manifest.json'
              if spath.exists(): staged += int(json.loads(spath.read_text()).get('staged',0))
              if cpath.exists(): accepted += int(json.loads(cpath.read_text()).get('accepted',0))
              if fpath.exists(): measured.update({k:int(v) for k,v in json.loads(fpath.read_text()).get('profiles',{}).items()})
              if mpath.exists(): supplements.append(str(mpath.parent))
          report={'staged':staged,'accepted':accepted,'measuredProfiles':dict(sorted(measured.items())),'supplementCatalogs':supplements}
          Path('work').mkdir(exist_ok=True)
          Path('work/weak-supply.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if not supplements or sum(measured.values()) < 10:
              raise SystemExit('Targeted collection did not produce enough measured real-photo supply')
          PY
      - name: Rebuild the physical 70k catalog with targeted supplements
        shell: bash
        run: |
          ARGS=(--catalog "current-site-seed=public/seed-catalog")
          while IFS= read -r manifest; do
            root=$(dirname "$manifest")
            label=$(basename "$(dirname "$root")")
            ARGS+=(--catalog "${label}=${root}")
          done < <(find work/weak-artifacts -path '*/supplement/manifest.json' -type f | sort)
          python tools/run_build_clean_core_v3_real_only.py \
            work/enriched --overwrite --target-total 70000 "${ARGS[@]}"
      - name: Validate zero synthetic faces and require real improvement
        run: |
          node tools/validate_face_catalog.mjs work/enriched/catalog \
            | tee work/enriched/catalog-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('data/clean-core-v3-site-build.json').read_text())
          audit=json.loads(Path('work/enriched/audit.json').read_text())
          manifest=json.loads(Path('work/enriched/catalog/manifest.json').read_text())
          before={k:int(v) for k,v in baseline.get('profileCounts',{}).items()}
          after={k:int(v) for k,v in audit.get('strictProfiles',{}).items()}
          critical=['winkLeft','winkRight','eyesWide','noseSneer','mouthRound','mouthSlightOpen','mouthOpen','smileOpen','mouthWide','mouthLeft','mouthRight','mouthFrown','mouthUpperUp','mouthLowerDown']
          changes={name:after.get(name,0)-before.get(name,0) for name in critical}
          improved=[name for name,value in changes.items() if value>0]
          regressions=[name for name,value in changes.items() if value<0]
          gain=sum(max(0,value) for value in changes.values())
          source_text=' '.join(audit.get('selectedSources',{})).lower()
          faces=int(manifest.get('searchableFaces',manifest.get('totalFaces',0)))
          failures=[]
          if faces != 70000: failures.append(f'faces={faces}, expected 70000')
          if len(manifest.get('cells',{})) != 775: failures.append(f"pose cells={len(manifest.get('cells',{}))}, expected 775")
          if int(audit.get('knownSyntheticFacesSelected',-1)) != 0: failures.append('known synthetic faces are not zero')
          if any(token in source_text for token in ('facs','verified-synthetic','synthetic-humans')): failures.append('synthetic source remained selected')
          if regressions: failures.append('critical regressions: '+', '.join(regressions))
          if len(improved) < 3: failures.append(f'only {len(improved)} critical profiles improved')
          if gain < 20: failures.append(f'total critical-profile gain={gain}, required >=20')
          if 'clean-v3-real-weak-v3' not in source_text: failures.append('no targeted supplement was selected')
          report={'before':before,'after':after,'changes':changes,'improvedProfiles':improved,'totalPositiveGain':gain,'selectedSources':audit.get('selectedSources',{}),'knownSyntheticFacesSelected':audit.get('knownSyntheticFacesSelected')}
          Path('work/enriched/improvement-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if failures: raise SystemExit('Enrichment gate failed:\n- '+'\n- '.join(failures))
          PY
      - name: Replace and verify the Site seed
        run: |
          rm -rf public/seed-catalog
          mkdir -p public/seed-catalog
          cp -a work/enriched/catalog/. public/seed-catalog/
          cp work/enriched/audit.json public/seed-catalog/clean-core-audit.json
          cp work/enriched/catalog-validation.json public/seed-catalog/catalog-validation.json
          cp work/enriched/improvement-report.json public/seed-catalog/weak-profile-improvement.json
          node tools/validate_face_catalog.mjs public/seed-catalog | tee /tmp/site-validation.json
      - name: Write transparent enrichment receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          previous=json.loads(Path('data/clean-core-v3-site-build.json').read_text())
          audit=json.loads(Path('public/seed-catalog/clean-core-audit.json').read_text())
          manifest=json.loads(Path('public/seed-catalog/manifest.json').read_text())
          validation=json.loads(Path('public/seed-catalog/catalog-validation.json').read_text())
          improvement=json.loads(Path('public/seed-catalog/weak-profile-improvement.json').read_text())
          receipt={'schemaVersion':3,'siteSeedVerified':True,'gatePassed':True,'runtimeImagePolicy':'real-photo-only-v1','catalogId':manifest.get('catalogId'),'searchableFaces':manifest.get('searchableFaces',manifest.get('totalFaces')),'poseStep':manifest.get('poseStep'),'poseCells':len(manifest.get('cells',{})),'knownSyntheticFacesSelected':0,'knownSyntheticCandidatesExcluded':audit.get('knownSyntheticCandidatesExcluded',{}),'profileCounts':audit.get('strictProfiles',{}),'profilePoseCells':audit.get('strictProfilePoseCells',{}),'sourceCounts':audit.get('selectedSources',{}),'rejections':audit.get('rejections',{}),'weakProfileImprovement':improvement,'previousPromotionWorkflowRunId':previous.get('promotionWorkflowRunId'),'promotionWorkflowRunId':int('${{ github.run_id }}'),'builtFromCommit':'${{ github.event.pull_request.head.sha || github.sha }}','validator':validation,'sitePath':'public/seed-catalog','syntheticRuntimeFaces':0}
          Path('data/clean-core-v3-site-build.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit the strengthened real-photo Site seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 1073741824
          git add -A -- public/seed-catalog data/clean-core-v3-site-build.json
          git commit -m "feat(dataset): strengthen weak real-photo profiles"
          git push origin HEAD:work/coverage-driven-200k
      - uses: actions/upload-artifact@v4
        with:
          name: many-faces-clean-core-v3-enriched-site-seed-${{ github.run_id }}
          path: |
            public/seed-catalog
            data/clean-core-v3-site-build.json
            work/weak-supply.json
            work/enriched/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
